name: Template Deploy
on:
  workflow_call:
    outputs:
      deployed:
        description: Whether Template Deploy actually packed and uploaded
        value: ${{ jobs.deploy-templates.result == 'success' }}
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string
      monoglue-build:
        description: "Build Status for Monoglue"
        required: true
        type: string
      windows-build:
        description: "Build Status for Windows"
        required: true
        type: string
      macos-build:
        description: "Build Status for MacOS"
        required: true
        type: string
      linux-build:
        description: "Build Status for Linux"
        required: true
        type: string
      android-build:
        description: "Build Status for Android"
        required: true
        type: string
      ios-build:
        description: "Build Status for iOS"
        required: true
        type: string
      web-build:
        description: "Build Status for Web"
        required: false
        default: ""
        type: string
      release_url:
        description: "Release URL to upload files to the Release URL"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BASE_NAME: Blazium_v${{ inputs.new_version }}

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-template-deploy
  cancel-in-progress: true

jobs:
  do-we-deploy-lol:
    name: Should we Deploy?
    runs-on: "ubuntu-22.04"
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Print Inputs and Initial Debugging
        run: |
          echo "Client Payload Force: ${{ github.event.client_payload.force }}"
          echo "Inputs:"
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}"
          echo "  - windows-build: ${{ inputs.windows-build }}"
          echo "  - macos-build: ${{ inputs.macos-build }}"
          echo "  - linux-build: ${{ inputs.linux-build }}"
          echo "  - android-build: ${{ inputs.android-build }}"
          echo "  - ios-build: ${{ inputs.ios-build }}"
          echo "  - web-build: ${{ inputs.web-build }}"
          echo "--- End of Inputs ---"

      - name: Are we Deploying?
        id: evaluate
        run: |
          BUILD="${{ join(github.event.client_payload.build, ',') }}"

          requested() {
            printf '%s\n' "$BUILD" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$1"
          }

          platform_ok() {
            local platform="$1"
            local result="$2"
            if requested "$platform"; then
              if [ "$result" != "success" ]; then
                echo "Requested platform $platform result=$result (need success)." >> $GITHUB_STEP_SUMMARY
                return 1
              fi
            fi
            return 0
          }

          echo "Evaluating Deployment Condition..." >> $GITHUB_STEP_SUMMARY
          echo "build: $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "deploy: ${{ join(github.event.client_payload.deploy, ',') }}" >> $GITHUB_STEP_SUMMARY
          echo "monoglue-build=${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "windows-build=${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "macos-build=${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "linux-build=${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "android-build=${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "ios-build=${{ inputs.ios-build }}" >> $GITHUB_STEP_SUMMARY
          echo "web-build=${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.client_payload.force }}" == "true" ]]; then
            echo "Force deploy is true. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.client_payload.run_id }}" ]]; then
            echo "Resuming prior run_id. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif platform_ok monoglue "${{ inputs.monoglue-build }}" &&
               platform_ok windows "${{ inputs.windows-build }}" &&
               platform_ok macos "${{ inputs.macos-build }}" &&
               platform_ok linux "${{ inputs.linux-build }}" &&
               platform_ok android "${{ inputs.android-build }}" &&
               platform_ok ios "${{ inputs.ios-build }}" &&
               platform_ok web "${{ inputs.web-build }}"; then
            echo "Requested builds succeeded. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "A requested build failed or was cancelled. Refusing deploy." >> $GITHUB_STEP_SUMMARY
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log Outputs to Step Summary
        if: always()
        run: |
          echo "### Debugging Outputs" >> $GITHUB_STEP_SUMMARY
          echo "Client Payload Force: ${{ github.event.client_payload.force }}" >> $GITHUB_STEP_SUMMARY
          echo "Inputs:" >> $GITHUB_STEP_SUMMARY
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - windows-build: ${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - macos-build: ${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - linux-build: ${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - android-build: ${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - ios-build: ${{ inputs.ios-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - web-build: ${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY
          echo "Proceed Output: ${{ steps.evaluate.outputs.proceed }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if we cannot deploy
        if: steps.evaluate.outputs.proceed != 'true'
        run: |
          echo "Deploy gate refused to proceed." >> $GITHUB_STEP_SUMMARY
          exit 1
  deploy-templates:
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    runs-on:  
      group: release-builder
    name: Template Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve deploy platforms
        id: platforms
        uses: ./.github/actions/resolve-deploy-platforms
        with:
          build: ${{ join(github.event.client_payload.build, ',') }}
          run_id: ${{ github.event.client_payload.run_id }}

      - name: Resolve template artifact names
        id: artifacts
        uses: ./.github/actions/resolve-template-artifacts
        with:
          suffix: ${{ inputs.external_status }}
          linux: ${{ steps.platforms.outputs.linux }}
          macos: ${{ steps.platforms.outputs.macos }}
          windows: ${{ steps.platforms.outputs.windows }}
          android: ${{ steps.platforms.outputs.android }}
          web: ${{ steps.platforms.outputs.web }}
          ios: ${{ steps.platforms.outputs.ios }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download All Template Files
        uses: ./.github/actions/cerebro-download-multi-build
        with:
          names: ${{ steps.artifacts.outputs.names }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          folder: ${{ github.workspace }}/downloads
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}

      - name: Uncompress Templates
        uses: ./.github/actions/multi-uncompress-tar-gz
        with:
          names: ${{ steps.artifacts.outputs.names }}
          input_dir: ${{ github.workspace }}/downloads
          output_dir: ${{ github.workspace }}/extracted

      - name: Copy & Rename Web Templates
        if: steps.platforms.outputs.web == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.web_names }}
          filename_old: ${{ steps.artifacts.outputs.web_old }}
          filename_new: ${{ steps.artifacts.outputs.web_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename Windows Templates
        if: steps.platforms.outputs.windows == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.windows_names }}
          filename_old: ${{ steps.artifacts.outputs.windows_old }}
          filename_new: ${{ steps.artifacts.outputs.windows_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename Windows Templates (mono)
        if: steps.platforms.outputs.windows == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.windows_mono_names }}
          filename_old: ${{ steps.artifacts.outputs.windows_mono_old }}
          filename_new: ${{ steps.artifacts.outputs.windows_mono_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates/mono

      - name: Copy & Rename Linux Templates
        if: steps.platforms.outputs.linux == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.linux_names }}
          filename_old: ${{ steps.artifacts.outputs.linux_old }}
          filename_new: ${{ steps.artifacts.outputs.linux_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename Linux Templates (mono)
        if: steps.platforms.outputs.linux == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.linux_mono_names }}
          filename_old: ${{ steps.artifacts.outputs.linux_mono_old }}
          filename_new: ${{ steps.artifacts.outputs.linux_mono_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates/mono

      - name: Copy & Rename MacOS Templates
        if: steps.platforms.outputs.macos == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.macos_names }}
          filename_old: ${{ steps.artifacts.outputs.macos_old }}
          filename_new: ${{ steps.artifacts.outputs.macos_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename iOS Templates
        if: steps.platforms.outputs.ios == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.ios_names }}
          filename_old: ${{ steps.artifacts.outputs.ios_old }}
          filename_new: ${{ steps.artifacts.outputs.ios_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename MacOS Templates (mono)
        if: steps.platforms.outputs.macos == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.macos_mono_names }}
          filename_old: ${{ steps.artifacts.outputs.macos_mono_old }}
          filename_new: ${{ steps.artifacts.outputs.macos_mono_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates/mono

      - name: Copy & Rename iOS Templates (mono)
        if: steps.platforms.outputs.ios == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.ios_mono_names }}
          filename_old: ${{ steps.artifacts.outputs.ios_mono_old }}
          filename_new: ${{ steps.artifacts.outputs.ios_mono_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates/mono

      - name: Copy & Rename Android Templates
        if: steps.platforms.outputs.android == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.android_names }}
          filename_old: ${{ steps.artifacts.outputs.android_old }}
          filename_new: ${{ steps.artifacts.outputs.android_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates

      - name: Copy & Rename Android Templates (mono)
        if: steps.platforms.outputs.android == 'true'
        uses: ./.github/actions/multi-copy-rename
        with:
          names: ${{ steps.artifacts.outputs.android_mono_names }}
          filename_old: ${{ steps.artifacts.outputs.android_mono_old }}
          filename_new: ${{ steps.artifacts.outputs.android_mono_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/templates/mono

      - name: List Templates Directory
        shell: bash
        run: |
          if [ -d "${GITHUB_WORKSPACE}/templates" ]; then
            echo "Contents of the templates directory:" >> $GITHUB_STEP_SUMMARY
            echo "$(ls -la "${GITHUB_WORKSPACE}/templates")" >> $GITHUB_STEP_SUMMARY
          else
            echo "Directory ${GITHUB_WORKSPACE}/templates does not exist." >> $GITHUB_STEP_SUMMARY
          fi

      - name: List Templates/Mono Directory
        shell: bash
        run: |
          if [ -d "${GITHUB_WORKSPACE}/templates/mono" ]; then
            echo "Contents of the templates/mono directory:" >> $GITHUB_STEP_SUMMARY
            echo "$(ls -la "${GITHUB_WORKSPACE}/templates/mono")" >> $GITHUB_STEP_SUMMARY
          else
            echo "Directory ${GITHUB_WORKSPACE}/templates/mono does not exist." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Checksums for Templates
        uses: ./.github/actions/checksum-txt-generator
        with:
          directory: ${{ github.workspace }}/templates

      - name: Generate Checksums for Mono Templates
        uses: ./.github/actions/checksum-txt-generator
        with:
          directory: ${{ github.workspace }}/templates/mono

      - name: Write New Version to File
        shell: bash
        run: |
          # Define the target folder and file
          TARGET_DIR="${GITHUB_WORKSPACE}/templates"
          TARGET_FILE="${TARGET_DIR}/version.txt"

          # Ensure the target directory exists
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Creating directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
          fi

          # Write the new version to the file
          echo "${{ inputs.new_version }}.${{ inputs.external_status }}" > "$TARGET_FILE"

          # Log the action
          echo "New version written to $TARGET_FILE:" >> $GITHUB_STEP_SUMMARY
          cat "$TARGET_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Write New Mono Version to File
        shell: bash
        run: |
          # Define the target folder and file
          TARGET_DIR="${GITHUB_WORKSPACE}/templates/mono"
          TARGET_FILE="${TARGET_DIR}/version.txt"

          # Ensure the target directory exists
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Creating directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
          fi

          # Write the new version to the file
          echo "${{ inputs.new_version }}.${{ inputs.external_status }}.mono" > "$TARGET_FILE"

          # Log the action
          echo "New version written to $TARGET_FILE:" >> $GITHUB_STEP_SUMMARY
          cat "$TARGET_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Package per-file template CDN artifacts
        shell: bash
        run: |
          CDN_DIR="${GITHUB_WORKSPACE}/templates_cdn"
          rm -rf "$CDN_DIR"
          mkdir -p "$CDN_DIR"

          package_tree() {
            local SRC="$1"
            for f in "$SRC"/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                version.txt|checksum.txt) continue ;;
              esac
              if [ -f "$CDN_DIR/$base" ] || [ -f "$CDN_DIR/${base}.zip" ]; then
                echo "Skipping duplicate $base"
                continue
              fi
              if [[ "$base" == *.zip ]] || [[ "$base" == *.apk ]]; then
                cp "$f" "$CDN_DIR/$base"
              elif [[ "$base" == *.exe ]]; then
                cp "$f" "$CDN_DIR/$base"
              else
                (cd "$SRC" && bash "$GITHUB_WORKSPACE/.github/scripts/create_zip.sh" "$CDN_DIR/${base}.zip" "$base")
              fi
            done
          }

          package_tree "${GITHUB_WORKSPACE}/templates"
          if [ -d "${GITHUB_WORKSPACE}/templates/mono" ]; then
            for f in "${GITHUB_WORKSPACE}/templates/mono"/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                version.txt|checksum.txt) continue ;;
              esac
              mono_name="$base"
              if [[ "$base" != *.mono.* ]] && [[ "$base" != mono_* ]]; then
                if [[ "$base" == *.zip ]]; then
                  mono_name="${base%.zip}.mono.zip"
                elif [[ "$base" == *.exe ]]; then
                  mono_name="${base%.exe}.mono.exe"
                else
                  mono_name="${base}.mono"
                fi
              fi
              if [ -f "$CDN_DIR/$mono_name" ] || [ -f "$CDN_DIR/${mono_name}.zip" ]; then
                continue
              fi
              if [[ "$base" == *.zip ]] || [[ "$base" == *.apk ]]; then
                cp "$f" "$CDN_DIR/$mono_name"
              elif [[ "$base" == *.exe ]]; then
                cp "$f" "$CDN_DIR/$mono_name"
              else
                (cd "${GITHUB_WORKSPACE}/templates/mono" && bash "$GITHUB_WORKSPACE/.github/scripts/create_zip.sh" "$CDN_DIR/${mono_name}.zip" "$base")
              fi
            done
          fi

          echo "CDN template artifacts:" >> $GITHUB_STEP_SUMMARY
          ls -la "$CDN_DIR" >> $GITHUB_STEP_SUMMARY

      - name: Generate per-file template_files.json
        shell: bash
        env:
          VERSION_FULL: ${{ inputs.new_version }}.${{ inputs.external_status }}
          URL_BASE: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}
          ENGINE_REFERENCE: ${{ inputs.engine_reference }}
          GODOT_LINE: ${{ inputs.godot_line }}
          CHANNEL: ${{ inputs.external_status }}
          VERSION: ${{ inputs.new_version }}
        run: |
          CDN_DIR="${GITHUB_WORKSPACE}/templates_cdn"
          # Per-file Cerebro manifest — must not overwrite Godot bundle templates.json
          OUTPUT_FILE="${CDN_DIR}/template_files.json"

          infer_platform() {
            case "$1" in
              web_*) echo web ;;
              linux_*) echo linux ;;
              windows_*) echo windows ;;
              macos*) echo macos ;;
              android_*) echo android ;;
              ios*) echo ios ;;
              *) echo "" ;;
            esac
          }

          infer_arch() {
            case "$1" in
              web_*) echo wasm32 ;;
              *x86_64*) echo x86_64 ;;
              *x86_32*) echo x86_32 ;;
              *arm64*) echo arm64 ;;
              *arm32*) echo arm32 ;;
              macos.zip) echo universal ;;
              ios.zip) echo arm64 ;;
              *) echo "" ;;
            esac
          }

          JSON_ARRAY="[]"
          for FILE_PATH in "$CDN_DIR"/*; do
            [ -f "$FILE_PATH" ] || continue
            FILE_NAME=$(basename "$FILE_PATH")
            [ "$FILE_NAME" = "template_files.json" ] && continue
            [ "$FILE_NAME" = "templates.json" ] && continue
            [ "$FILE_NAME" = "details.json" ] && continue

            MONO=false
            if [[ "$FILE_NAME" == *.mono.zip ]] || [[ "$FILE_NAME" == *.mono.exe ]] || [[ "$FILE_NAME" == *.mono ]]; then
              MONO=true
            fi

            FILE_SHA256=$(sha256sum "$FILE_PATH" | awk '{print $1}')
            FILE_SIZE=$(stat -c%s "$FILE_PATH")
            PLATFORM=$(infer_platform "$FILE_NAME")
            ARCH=$(infer_arch "$FILE_NAME")

            JSON_ARRAY=$(echo "$JSON_ARRAY" | jq \
              --arg name "$FILE_NAME" \
              --arg sha256 "$FILE_SHA256" \
              --arg size "$FILE_SIZE" \
              --arg url "${URL_BASE}/$FILE_NAME" \
              --arg platform "$PLATFORM" \
              --arg arch "$ARCH" \
              --arg version "$VERSION_FULL" \
              --argjson mono "$MONO" \
              --arg reference "$ENGINE_REFERENCE" \
              --arg godot "$GODOT_LINE" \
              '. + [{
                "filename": $name,
                "download_url": $url,
                "sha256": $sha256,
                "size": ($size | tonumber),
                "platform": $platform,
                "arch": $arch,
                "mono": $mono,
                "version": $version,
                "reference": $reference,
                "godot": $godot
              }]'
            )
          done

          echo "$JSON_ARRAY" > "$OUTPUT_FILE"
          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg reference "$ENGINE_REFERENCE" \
            --arg godot "$GODOT_LINE" \
            '{version: $version, channel: $channel, reference: $reference, godot: $godot}' \
            > "${CDN_DIR}/line.json"
          echo "Generated per-file template_files.json" >> $GITHUB_STEP_SUMMARY
          cat "$OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Upload per-file templates to CDN
        shell: bash
        env:
          SPACE: ${{ secrets.DO_SPACE_NAME }}
          REGION: ${{ secrets.DO_SPACE_REGION }}
          KEY: ${{ secrets.DO_ACCESS_KEY }}
          SECRET: ${{ secrets.DO_SECRET_KEY }}
          SPACE_PATH: /${{ inputs.external_status }}/${{ inputs.new_version }}/
        run: |
          CDN_DIR="${GITHUB_WORKSPACE}/templates_cdn"
          putS3() {
            local path=$1
            local file=$2
            local space_path=$3
            local date=$(date +"%a, %d %b %Y %T %z")
            local acl="x-amz-acl:public-read"
            local content_type=$(file --mime-type -b "$path/$file")
            local storage_type="x-amz-storage-class:STANDARD"
            local string="PUT\n\n$content_type\n$date\n$acl\n$storage_type\n/$SPACE$space_path$file"
            local signature=$(echo -en "${string}" | openssl sha1 -hmac "${SECRET}" -binary | base64)
            curl -s -X PUT -T "$path/$file" \
              -H "Host: $SPACE.${REGION}.digitaloceanspaces.com" \
              -H "Date: $date" \
              -H "Content-Type: $content_type" \
              -H "$storage_type" \
              -H "$acl" \
              -H "Authorization: AWS ${KEY}:$signature" \
              "https://$SPACE.${REGION}.digitaloceanspaces.com$space_path$file"
          }

          for FILE_PATH in "$CDN_DIR"/*; do
            [ -f "$FILE_PATH" ] || continue
            FILE_NAME=$(basename "$FILE_PATH")
            echo "Uploading $FILE_NAME to CDN" >> $GITHUB_STEP_SUMMARY
            putS3 "$CDN_DIR" "$FILE_NAME" "$SPACE_PATH"
          done

      - name: Register per-file templates in Cerebro
        shell: bash
        env:
          CEREBRO_URL: ${{ secrets.CEREBRO_URL }}
          CEREBRO_AUTH: ${{ secrets.BLAZIUM_AUTH }}
          RUN_ID: ${{ inputs.runner_id }}
          DEPLOY_TYPE: ${{ inputs.external_status }}
          VERSION: ${{ inputs.new_version }}
          BRANCH: ${{ github.event.client_payload.branch }}
          PRODUCTION: ${{ github.event.client_payload.production }}
        run: |
          MANIFEST="${GITHUB_WORKSPACE}/templates_cdn/template_files.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "No template_files.json manifest; skipping Cerebro registration."
            exit 0
          fi

          jq -c '.[]' "$MANIFEST" | while read -r entry; do
            FILENAME=$(echo "$entry" | jq -r '.filename')
            FILE_URL=$(echo "$entry" | jq -r '.download_url')
            CHECKSUM=$(echo "$entry" | jq -r '.sha256')
            PLATFORM=$(echo "$entry" | jq -r '.platform')
            ARCH=$(echo "$entry" | jq -r '.arch')
            MONO=$(echo "$entry" | jq -r '.mono')
            VERSION=$(echo "$entry" | jq -r '.version')
            SAFE_NAME=$(echo -n "$FILENAME" | sha256sum | awk '{print $1}' | cut -c1-16)
            BUILD_NAME="template-file-${SAFE_NAME}-${DEPLOY_TYPE}"

            START_BODY=$(echo "$entry" | jq \
              --arg name "$BUILD_NAME" \
              --arg run_id "$RUN_ID" \
              --arg build_type "Template" \
              --arg deploy_type "$DEPLOY_TYPE" \
              --arg branch "${BRANCH:-main}" \
              --arg build_os "$PLATFORM" \
              --arg arch "$ARCH" \
              --arg checksum "$CHECKSUM" \
              --arg version "$VERSION" \
              --argjson production "${PRODUCTION:-false}" \
              '{name: $name, run_id: $run_id, build_type: $build_type, mono: .mono, deploy_type: $deploy_type, branch: $branch, build_os: $build_os, arch: $arch, checksum: $checksum, production: $production, version: $version}')

            curl -s -X POST "${CEREBRO_URL}/api/v1/enginebuilds" \
              -H "Content-Type: application/json" \
              -H "BLAZIUM_AUTH: ${CEREBRO_AUTH}" \
              -d "$START_BODY" > /dev/null

            COMPLETE_BODY=$(jq -n \
              --arg file_url "$FILE_URL" \
              --arg version "$VERSION" \
              --arg checksum "$CHECKSUM" \
              '{file_url: $file_url, version: $version, checksum: $checksum}')

            response=$(curl -s -X POST "${CEREBRO_URL}/api/v1/enginebuilds/${RUN_ID}/completed/${BUILD_NAME}" \
              -H "Content-Type: application/json" \
              -H "BLAZIUM_AUTH: ${CEREBRO_AUTH}" \
              -d "$COMPLETE_BODY")

            if echo "$response" | grep -q '"success":false'; then
              echo "Warning: Cerebro registration failed for $FILENAME: $response" >> $GITHUB_STEP_SUMMARY
            else
              echo "Registered template file $FILENAME in Cerebro" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Compress Templates/Mono Directory
        shell: bash
        run: |
          # Define variables
          TARGET_DIR="${GITHUB_WORKSPACE}/templates/mono"
          RELDIR="${GITHUB_WORKSPACE}/export"
          ZIP_FILE="${RELDIR}/${BASE_NAME}_mono_export_templates.tpz"

          # Ensure the target directory exists
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Error: Target directory $TARGET_DIR does not exist."
            exit 1
          fi

          # Ensure the output directory exists
          if [ ! -d "$RELDIR" ]; then
            echo "Creating output directory: $RELDIR"
            mkdir -p "$RELDIR"
          fi

          # Create the zip file (ZIP format via 7z for .tpz)
          (cd "$TARGET_DIR" && bash "$GITHUB_WORKSPACE/.github/scripts/create_zip.sh" "$ZIP_FILE" .)

          # Log the result
          if [ $? -eq 0 ]; then
            echo "Zip file created successfully: $ZIP_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Failed to create the zip file." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
      - name: Delete Templates/Mono Directory
        shell: bash
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/templates/mono"
          rm -rf $TARGET_DIR
          
      - name: Compress Templates Directory
        shell: bash
        run: |
          # Define variables
          TARGET_DIR="${GITHUB_WORKSPACE}/templates"
          RELDIR="${GITHUB_WORKSPACE}/export"
          ZIP_FILE="${RELDIR}/${BASE_NAME}_export_templates.tpz"

          # Ensure the target directory exists
          if [ ! -d "$TARGET_DIR" ]; then
            echo "Error: Target directory $TARGET_DIR does not exist."
            exit 1
          fi

          # Ensure the output directory exists
          if [ ! -d "$RELDIR" ]; then
            echo "Creating output directory: $RELDIR"
            mkdir -p "$RELDIR"
          fi

          # Create the zip file (ZIP format via 7z for .tpz)
          (cd "$TARGET_DIR" && bash "$GITHUB_WORKSPACE/.github/scripts/create_zip.sh" "$ZIP_FILE" .)

          # Log the result
          if [ $? -eq 0 ]; then
            echo "Zip file created successfully: $ZIP_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Failed to create the zip file." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Generate Checksums for Packaged Templates
        uses: ./.github/actions/checksum-txt-generator
        with:
          directory: ${{ github.workspace }}/export

      - name: Upload Template Release Assets
        continue-on-error: ${{ github.event.client_payload.run_id != '' }}
        id: template-upload
        uses: ./.github/actions/upload-github-release
        with:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_PAT }}
          UPLOAD_URL: ${{ inputs.release_url }}
          FILES: |
            ${{ github.workspace }}/export/${{ env.BASE_NAME }}_export_templates.tpz
            ${{ github.workspace }}/export/${{ env.BASE_NAME }}_mono_export_templates.tpz

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: export/${{ env.BASE_NAME }}_export_templates.tpz
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: export/${{ env.BASE_NAME }}_mono_export_templates.tpz
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - name: Generate bundle details.json with File Info and Checksums
        shell: bash
        env:
          BASE_NAME: ${{ env.BASE_NAME }}
          URL_BASE: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}
          UPLOADED_FILES: ${{ steps.template-upload.outputs.uploaded_files }}
        run: |
          # Define file paths and output file
          TARGET_DIR="${GITHUB_WORKSPACE}/export"
          BASE_FILE="${TARGET_DIR}/${BASE_NAME}_export_templates.tpz"
          MONO_FILE="${TARGET_DIR}/${BASE_NAME}_mono_export_templates.tpz"
          OUTPUT_FILE="${TARGET_DIR}/details.json"

          # Ensure files exist
          if [ ! -f "$BASE_FILE" ]; then
            echo "Error: File $BASE_FILE does not exist."
            exit 1
          fi
          if [ ! -f "$MONO_FILE" ]; then
            echo "Error: File $MONO_FILE does not exist."
            exit 1
          fi

          # Parse multi-file upload-github-release output (comma-separated browser_download_urls)
          GITHUB_TEMPLATE=""
          MONO_GITHUB_TEMPLATE=""
          IFS=',' read -ra UPLOADED_URLS <<< "${UPLOADED_FILES:-}"
          for u in "${UPLOADED_URLS[@]}"; do
            u="$(echo "$u" | xargs)"
            [[ -z "$u" ]] && continue
            if [[ "$u" == *"_mono_export_templates.tpz"* ]]; then
              MONO_GITHUB_TEMPLATE="$u"
            elif [[ "$u" == *"_export_templates.tpz"* ]]; then
              GITHUB_TEMPLATE="$u"
            fi
          done

          # Compute SHA-512 checksums
          BASE_512_CHECKSUM=$(sha512sum "$BASE_FILE" | awk '{print $1}')
          MONO_512_CHECKSUM=$(sha512sum "$MONO_FILE" | awk '{print $1}')
          BASE_256_CHECKSUM=$(sha256sum "$BASE_FILE" | awk '{print $1}')
          MONO_256_CHECKSUM=$(sha256sum "$MONO_FILE" | awk '{print $1}')
          # If this is being pushed to a CDN please remember that Cacheing happens, and if the values do not
          # show up correctly via the file/cdn its prolly because of Cacheing.....
          # Get File Sizes due to Content-Length issues on CDN
          BASE_FILE_SIZE=$(stat -c%s "$BASE_FILE")
          MONO_FILE_SIZE=$(stat -c%s "$MONO_FILE")

          # Generate timestamps
          BASE_TIMESTAMP=$(date -r "$BASE_FILE" +"%d %B %Y")
          MONO_TIMESTAMP=$(date -r "$MONO_FILE" +"%d %B %Y")

          # Generate JSON object with jq
          jq -n \
            --arg base_filename "$(basename "$BASE_FILE")" \
            --arg base_256_checksum "$BASE_256_CHECKSUM" \
            --arg base_512_checksum "$BASE_512_CHECKSUM" \
            --arg base_url "${URL_BASE}/$(basename "$BASE_FILE")" \
            --arg base_github_url "${GITHUB_TEMPLATE}" \
            --arg base_timestamp "$BASE_TIMESTAMP" \
            --arg base_filesize "$BASE_FILE_SIZE" \
            --arg mono_filename "$(basename "$MONO_FILE")" \
            --arg mono_256_checksum "$MONO_256_CHECKSUM" \
            --arg mono_512_checksum "$MONO_512_CHECKSUM" \
            --arg mono_url "${URL_BASE}/$(basename "$MONO_FILE")" \
            --arg mono_github_url "${MONO_GITHUB_TEMPLATE}" \
            --arg mono_timestamp "$MONO_TIMESTAMP" \
            --arg mono_filesize "$MONO_FILE_SIZE" \
            '{
              base: {
                name: "Official Blazium Templates Mirror",
                filename: $base_filename,
                filesize: $base_filesize,
                checksum: {
                  "512": $base_512_checksum,
                  "256": $base_256_checksum
                },
                url: $base_url,
                timestamp: $base_timestamp,
                mirrors: [{
                  name: "Github Blazium Templates Mirror",
                  filename: $base_filename,
                  filesize: $base_filesize,
                  checksum: {
                    "512": $base_512_checksum,
                    "256": $base_256_checksum
                  },
                  url: $base_github_url,
                  timestamp: $base_timestamp
                }]
              },
              mono: {
                name: "Official Blazium Mono Templates Mirror",
                filename: $mono_filename,
                filesize: $mono_filesize,
                checksum: {
                  "512": $mono_512_checksum,
                  "256": $mono_256_checksum
                },
                url: $mono_url,
                timestamp: $mono_timestamp,
                mirrors:[{
                  name: "Github Blazium Mono Templates Mirror",
                  filename: $mono_filename,
                  filesize: $mono_filesize,
                  checksum: {
                    "512": $mono_512_checksum,
                    "256": $mono_256_checksum
                  },
                  url: $mono_github_url,
                  timestamp: $mono_timestamp
                }]
              }
            }' > "$OUTPUT_FILE"

          # Keep Godot-compatible templates.json in sync for older website deployments
          cp "$OUTPUT_FILE" "${TARGET_DIR}/templates.json"

          # Log the generated JSON
          echo "Generated JSON file: $OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY
          echo "Contents:" >> $GITHUB_STEP_SUMMARY
          cat "$OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: export/checksum.txt
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: export/details.json
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: export/templates.json
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}
