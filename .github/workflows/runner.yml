name: 🔗 GHA
on:
  repository_dispatch:
    types: [trigger_build]
env:
  BASE_NAME: Blazium_v
  GODOT_BASE_BRANCH: blazium-dev

concurrency:
  group: ci-${{ github.actor }}-${{ github.event.client_payload.branch || 'blazium-dev' }}-${{ github.event.client_payload.type || 'nightly' }}-runner
  cancel-in-progress: true

jobs:
  get-latest-sha:
    name: 🔍 Get Latest SHA & Base Version
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.get_sha.outputs.sha }}
      external_major: ${{ steps.version.outputs.external_major }}
      external_minor: ${{ steps.version.outputs.external_minor }}
      external_patch: ${{ steps.version.outputs.external_patch }}
      external_sha: ${{ steps.version.outputs.external_sha }}
      external_status: ${{ steps.line.outputs.external_status }}
      engine_reference: ${{ steps.line.outputs.reference }}
      godot_line: ${{ steps.line.outputs.godot }}
      major: ${{ steps.new_version.outputs.major }}
      minor: ${{ steps.new_version.outputs.minor }}
      patch: ${{ steps.new_version.outputs.patch }}
      version_string: ${{ steps.new_version.outputs.version_string }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ github.event.client_payload.branch || env.GODOT_BASE_BRANCH }}
          fetch-depth: 2

      - name: Pull .github folder from ci_cd repository
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          mv ci_cd_repo/cicd ./
          rm -rf ci_cd_repo

      - name: Get Latest Commit SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Parse version.py
        id: version
        uses: ./.github/actions/get-repos-version
        with:
          file_path: version.py

      - name: Resolve deploy channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          TYPE="${{ github.event.client_payload.type }}"
          case "$TYPE" in
            release) STATUS="release" ;;
            prerelease) STATUS="prerelease" ;;
            nightly|"") STATUS="nightly" ;;
            *)
              echo "Error: unsupported deploy type '$TYPE' (expected release, prerelease, or nightly)." >&2
              exit 1
              ;;
          esac
          echo "external_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Deploy channel: $STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Freeze version if this SHA already has completed assets
        id: freeze
        env:
          CEREBRO_URL: ${{ secrets.CEREBRO_URL }}
          CEREBRO_AUTH: ${{ secrets.BLAZIUM_AUTH }}
          BUILD_SHA: ${{ steps.get_sha.outputs.sha }}
          DEPLOY_TYPE: ${{ steps.channel.outputs.external_status }}
          FALLBACK_MAJOR: ${{ steps.version.outputs.external_major }}
          FALLBACK_MINOR: ${{ steps.version.outputs.external_minor }}
          FALLBACK_PATCH: ${{ steps.version.outputs.external_patch }}
        run: |
          echo "freeze=0" >> "$GITHUB_OUTPUT"
          echo "major=$FALLBACK_MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$FALLBACK_MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$FALLBACK_PATCH" >> "$GITHUB_OUTPUT"
          if [ -z "$CEREBRO_URL" ]; then
            echo "Cerebro URL unset; not freezing version."
            exit 0
          fi
          QS="deploy_type=$(printf '%s' "$DEPLOY_TYPE" | jq -sRr @uri)&build_sha=$(printf '%s' "$BUILD_SHA" | jq -sRr @uri)"
          HTTP=$(curl -sS -o /tmp/cerebro_completed.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: $CEREBRO_AUTH" \
            "$CEREBRO_URL/api/v1/enginebuilds/completed?$QS" || echo "000")
          if [ "$HTTP" != "200" ] || ! jq -e '.success == true and (.data | length) > 0' /tmp/cerebro_completed.json >/dev/null 2>&1; then
            echo "No completed assets for this SHA (HTTP $HTTP)."
            exit 0
          fi
          VER=$(jq -r '.data[0].version // empty' /tmp/cerebro_completed.json)
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "Completed assets have no version; not freezing."
            exit 0
          fi
          IFS=. read -r MAJ MIN PAT <<EOF
          $VER
          EOF
          echo "freeze=1" >> "$GITHUB_OUTPUT"
          echo "major=$MAJ" >> "$GITHUB_OUTPUT"
          echo "minor=$MIN" >> "$GITHUB_OUTPUT"
          echo "patch=$PAT" >> "$GITHUB_OUTPUT"
          echo "Frozen version $VER from existing Cerebro assets."

      - name: Generate Changelog.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: blazium-games
          GITHUB_REPO: blazium
          BASE_BRANCH: ${{ steps.version.outputs.external_sha }}
          CURRENT_BRANCH: ${{ steps.get_sha.outputs.sha }}
          MAJOR_VERSION: ${{ steps.freeze.outputs.major }}
          MINOR_VERSION: ${{ steps.freeze.outputs.minor }}
          PATCH_VERSION: ${{ steps.freeze.outputs.patch }}
          BUILD_TYPE: ${{ steps.channel.outputs.external_status }}
          FREEZE_VERSION: ${{ steps.freeze.outputs.freeze }}
        run: |
          node ./cicd/scripts/changelog.js $(pwd)

      - name: Get Version from Changelog
        id: new_version
        uses: ./.github/actions/version-from-changelog
        with:
          file_path: ${{ github.workspace }}/changelog.json

      - name: Resolve engine line
        id: line
        uses: ./.github/actions/resolve-engine-line
        with:
          version: ${{ steps.new_version.outputs.version_string }}
          deploy_type: ${{ steps.channel.outputs.external_status }}


  static-checks:
    name: 📊 Static checks
    needs: get-latest-sha
    uses: ./.github/workflows/static_checks.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}

  web-build:
    name: 🌐 Web
    needs: [get-latest-sha, static-checks]
    if: contains(github.event.client_payload.build, 'web') && !github.event.client_payload.run_id
    uses: ./.github/workflows/web_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  monoglue-build:
    name: Mono Glue
    needs: [get-latest-sha, static-checks]
    if: >-
      !github.event.client_payload.run_id &&
      (
        contains(github.event.client_payload.build, 'monoglue') ||
        (
          (
            contains(github.event.client_payload.build, 'windows') ||
            contains(github.event.client_payload.build, 'linux') ||
            contains(github.event.client_payload.build, 'macos') ||
            contains(github.event.client_payload.build, 'android') ||
            contains(github.event.client_payload.build, 'ios')
          ) &&
          (
            contains(github.event.client_payload.build_type, 'editors') ||
            contains(github.event.client_payload.build_type, 'templates')
          )
        )
      )
    uses: ./.github/workflows/mono_glue_build.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  android-build:
    name: 🤖 Android
    needs: [monoglue-build, get-latest-sha]
    if: >-
      always() &&
      !cancelled() &&
      contains(github.event.client_payload.build, 'android') &&
      !github.event.client_payload.run_id &&
      needs.get-latest-sha.result == 'success' &&
      needs.monoglue-build.result != 'failure'
    uses: ./.github/workflows/android_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  ios-build:
    name: 🍏 iOS
    needs: [monoglue-build, get-latest-sha]
    if: >-
      always() &&
      !cancelled() &&
      contains(github.event.client_payload.build, 'ios') &&
      !github.event.client_payload.run_id &&
      needs.get-latest-sha.result == 'success' &&
      needs.monoglue-build.result != 'failure'
    uses: ./.github/workflows/ios_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  linux-build:
    name: 🐧 Linux
    needs: [monoglue-build, get-latest-sha]
    if: >-
      always() &&
      !cancelled() &&
      contains(github.event.client_payload.build, 'linux') &&
      !github.event.client_payload.run_id &&
      needs.get-latest-sha.result == 'success' &&
      needs.monoglue-build.result != 'failure'
    uses: ./.github/workflows/linux_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  macos-build:
    name: 🍎 macOS
    needs: [monoglue-build, get-latest-sha]
    if: >-
      always() &&
      !cancelled() &&
      contains(github.event.client_payload.build, 'macos') &&
      !github.event.client_payload.run_id &&
      needs.get-latest-sha.result == 'success' &&
      needs.monoglue-build.result != 'failure'
    uses: ./.github/workflows/macos_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  windows-build:
    name: 🏁 Windows
    needs: [monoglue-build, get-latest-sha]
    if: >-
      always() &&
      !cancelled() &&
      contains(github.event.client_payload.build, 'windows') &&
      !github.event.client_payload.run_id &&
      needs.get-latest-sha.result == 'success' &&
      needs.monoglue-build.result != 'failure'
    uses: ./.github/workflows/windows_builds.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}

  deploy:
    name: Deploy
    needs: [monoglue-build, windows-build, macos-build, linux-build, android-build, ios-build, web-build, get-latest-sha, static-checks]
    if: >-
      join(github.event.client_payload.deploy, '') != '' &&
      !failure() && 
      !cancelled() && 
      needs.*.result != 'failure' && 
      needs.*.result != 'cancelled'
    uses: ./.github/workflows/deploy_all.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      monoglue-build: ${{ needs.monoglue-build.result }}
      windows-build: ${{ needs.windows-build.result }}
      macos-build: ${{ needs.macos-build.result }}
      linux-build: ${{ needs.linux-build.result }}
      android-build: ${{ needs.android-build.result }}
      ios-build: ${{ needs.ios-build.result }}
      web-build: ${{ needs.web-build.result }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}


  cleanup:
    name: Clean Up
    needs: [monoglue-build, windows-build, macos-build, linux-build, android-build, ios-build, get-latest-sha]
    if: always() && (failure() || cancelled())
    uses: ./.github/workflows/clean_up.yml
    secrets: inherit
    with:
      build_sha: ${{ needs.get-latest-sha.outputs.build_sha }}
      runner_id: ${{ github.event.client_payload.run_id || github.run_id }}
      monoglue-build: ${{ needs.monoglue-build.result }}
      windows-build: ${{ needs.windows-build.result }}
      macos-build: ${{ needs.macos-build.result }}
      linux-build: ${{ needs.linux-build.result }}
      android-build: ${{ needs.android-build.result }}
      ios-build: ${{ needs.ios-build.result }}
      new_major: ${{ needs.get-latest-sha.outputs.major }}
      new_minor: ${{ needs.get-latest-sha.outputs.minor }}
      new_patch: ${{ needs.get-latest-sha.outputs.patch }}
      new_version: ${{ needs.get-latest-sha.outputs.version_string }}
      external_status: ${{ needs.get-latest-sha.outputs.external_status }}
      engine_reference: ${{ needs.get-latest-sha.outputs.engine_reference }}
      godot_line: ${{ needs.get-latest-sha.outputs.godot_line }}
