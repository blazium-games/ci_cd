name: 🏁 Windows Builds
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_major:
        description: "New Major # for Version"
        required: true
        type: string
      new_minor:
        description: "New Minor # for Version"
        required: true
        type: string
      new_patch:
        description: "New Patch # for Version"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string

# Global Settings
# SCONS_CACHE for windows must be set in the build environment
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BLAZIUM_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  EDITOR_BUILD_ID: ${{ inputs.build_sha }}
  SCONSFLAGS: verbose=yes warnings=no progress=no module_text_server_fb_enabled=yes d3d12=yes strict_checks=yes module_xbox_module_enabled=no use_mingw=no "angle_libs=${{ github.workspace }}/"
  SCONS_CACHE_MSVC_CONFIG: true
  DEPLOY_TYPE: windows
  DEBUG_SCONSFLAGS: debug_symbols=yes separate_debug_symbols=yes debug_paths_relative=yes

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-windows
  cancel-in-progress: true

jobs:

  editor-check:
    name: Checking Editor build.sha
    if: contains(github.event.client_payload.build_type, 'editors')
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.compile.outputs.should_compile }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          
          fetch-depth: 1

      - name: Validate Version
        if: ${{ github.event.client_payload.force != true }}
        id: compile
        uses: ./.github/actions/version-checker
        with:
          deploy_type: ${{ env.DEPLOY_TYPE }}
          build_type: ${{ inputs.external_status }}
          engine_reference: ${{ inputs.engine_reference }}
          build_sha: ${{ inputs.build_sha }}

  template-check:
    name: Checking Templates build.sha
    if: contains(github.event.client_payload.build_type, 'templates')
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.compile.outputs.should_compile == 'true' }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          
          fetch-depth: 1

      - name: Compilation
        if: ${{ github.event.client_payload.force != true }}
        id: compile
        uses: ./.github/actions/version-checker
        with:
          deploy_type: ${{ env.DEPLOY_TYPE }}
          build_type: ${{ inputs.external_status }}
          engine_reference: ${{ inputs.engine_reference }}
          build_sha: ${{ inputs.build_sha }}
          is_template: 'true'

  build-editors:
    runs-on: ${{ matrix.arm && 'ubuntu-22.04' || 'windows-latest' }}
    name: ${{ matrix.name }}
    needs: editor-check
    if: ${{ contains(github.event.client_payload.build_type, 'editors') }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Editor (64bit)
            cache-name: windows-editor-64bit
            target: editor
            sconsflags: arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: false

          - name: Editor w/ Mono (64bit)
            cache-name: windows-editor-mono-64bit
            target: editor
            sconsflags: module_mono_enabled=yes arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: true
            
          - name: Editor (32bit)
            cache-name: windows-editor-32bit
            target: editor
            sconsflags: arch=x86_32 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: false

          - name: Editor w/ Mono (32bit)
            cache-name: windows-editor-mono-32bit
            target: editor
            sconsflags: module_mono_enabled=yes arch=x86_32 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: true
            
          - name: Editor (arm64)
            cache-name: windows-editor-arm64
            target: editor
            sconsflags: arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none
            mono: false
            arm: true
            arch: arm64
            skip: false

          - name: Editor w/ Mono (arm64)
            cache-name: windows-editor-mono-arm64
            target: editor
            sconsflags: module_mono_enabled=yes arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none
            mono: true
            arm: true
            arch: arm64
            skip: false

    steps:
      - name: Skip Action?
        if: matrix.skip
        run: |
          echo "Skipping Build" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Checkout CI actions
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          fetch-depth: 1

      - name: Reuse completed asset
        if: ${{ !matrix.skip && github.event.client_payload.force != true }}
        id: reuse
        uses: ./.github/actions/cerebro-reuse-assets
        with:
          names: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Checkout Repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ inputs.build_sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Remove existing workflows folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          rm -rf .github/workflows

      - name: Pull .github folder from ci_cd repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          rm -rf ci_cd_repo

      - name: Normalize path
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        id: normalize
        shell: bash
        run: |
          normalized_workspace="$(echo "${{ github.workspace }}" | sed 's|\\|/|g')"
          echo "normalized_workspace=$normalized_workspace" >> "$GITHUB_OUTPUT"

      - name: Update new Version Information to version.py
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/set-repos-version
        with:
          file_path: ${{ steps.normalize.outputs.normalized_workspace }}/version.py
          external_major: ${{ inputs.new_major }}
          external_minor: ${{ inputs.new_minor }}
          external_patch: ${{ inputs.new_patch }}
          external_status: ${{ inputs.external_status }}
          external_sha: ${{ inputs.build_sha }}

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: ${{ startsWith(matrix.target, 'template_') && 'Template' || 'Editor' }}
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: windows
          arch: ${{ contains(matrix.cache-name, '32bit') && 'x86_32' || (contains(matrix.cache-name, 'arm64') && 'arm64' || 'x86_64') }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Restore Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-deps

      - name: Install llvm-mingw
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: |
          curl -LO https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          rm -f llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "MINGW_PREFIX=$(pwd)/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64" >> $GITHUB_ENV

      - name: Download and extract llvm-mingw SDK
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: |
          mkdir -p sdks
          cd sdks
          curl -LO https://github.com/mstorsjo/llvm-mingw/releases/download/20241015/llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz
          xz -dc llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz | tar -xvf -
          rm -f llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz
          echo "LLVM_MINGW=$(pwd)/llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64" >> $GITHUB_ENV

      - name: Download and extract mono-glue
        shell: bash
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          TYPE=${{ inputs.external_status }}
          REF=${{ inputs.engine_reference }}
          URL="https://cdn.blazium.app/monoglue/${REF}/${TYPE}/monoglue-${TYPE}.tar.gz"
          
          # Download the file
          curl -L $URL -o monoglue.tar.gz

          # Extract the entire archive to a temporary directory
          mkdir -p temp_extract
          tar -xzvf monoglue.tar.gz -C temp_extract

          # Create target directories if they don't exist
          mkdir -p modules/mono/glue/GodotSharp/GodotSharp
          mkdir -p modules/mono/glue/GodotSharp/GodotSharpEditor

          cp -r temp_extract/GodotSharp/* modules/mono/glue/GodotSharp/GodotSharp/
          cp -r temp_extract/GodotSharpEditor/* modules/mono/glue/GodotSharp/GodotSharpEditor/

          ls -la ./modules/mono/glue/GodotSharp/GodotSharp/
          ls -la ./modules/mono/glue/GodotSharp/GodotSharpEditor/

          # Clean up the temporary directory
          rm -rf temp_extract monoglue.tar.gz



      - name: Download Direct3D 12 SDK components
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download Direct3D 12 SDK components (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download pre-built ANGLE static libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-${{ matrix.arch == 'x86' && 'x86_32' || (matrix.arch == 'arm64' && 'arm64' || 'x86_64') }}-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built ANGLE static libraries (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-arm64-llvm-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: unzip -o angle/angle.zip -d .

      - name: Download Mesa Libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/download-mesa-action
        with:
          mesa_url_base: "https://github.com/godotengine/godot-nir-static/releases/download/23.1.9-1/godot-nir-static"
          mesa_folder: "${{ steps.normalize.outputs.normalized_workspace }}/deps/mesa"
          variant: ${{ matrix.arm && 'llvm' || 'msvc' }}
          architectures: ${{ matrix.arm && 'arm64' || 'x86_64,x86_32,arm64' }}

      - name: Setup MSVC
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86' && 'amd64_x86' || matrix.arch }}

      - name: Compilation
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ matrix.sconsflags }} ${{ env.SCONSFLAGS }} ${{ github.event.client_payload.production && '' || env.DEBUG_SCONSFLAGS }} "mesa_libs=${{ steps.normalize.outputs.normalized_workspace }}/deps/mesa"
          platform: windows
          target: ${{ matrix.target }}
          build-name: blazium
          scons-cache: "${{ github.workspace }}/.scons_cache/"

      - name: Building C# Assemblies
        shell: bash
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows

      - name: Save Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      #- name: Clone sslcom-code-signer
      #  uses: actions/checkout@v4
      #  with:
      #    repository: bioblaze/sslcom-code-signer
      #    path: codesign-tool
      #    ref: v5
      #    fetch-depth: 1

      #- name: Unzip and Setup CodeSignTool
      #  working-directory: codesign-tool
      #  shell: bash
      #  run: |
      #    unzip "/tmp/CodeSignTool-v1.3.2.zip" -d "/tmp/CodeSignTool-v1.3.2"
      #    mkdir -p /codesign
      #    mv "/tmp/CodeSignTool-v1.3.2" "/codesign"
      #    chmod +x "/codesign/CodeSignTool.sh"
      #    ln -s "/codesign/CodeSignTool.sh" "/usr/bin/codesign"
      #    mv ./codesign-tool/ /codesign
      #    mv ./entrypoint.sh /entrypoint.sh
      #    chmod +x /entrypoint.sh

      #- name: Sign Code
      #  working-directory: /codesign
      #  shell: bash
      #  run: |
      #    /entrypoint.sh

      # - uses: bioblaze/sslcom-code-signer@v6
      #   with:
      #     command: sign
      #     username: ${{ secrets.ES_USERNAME }}
      #     password: ${{ secrets.ES_PASSWORD }}
      #     credential_id: ${{ secrets.CREDENTIAL_ID }}
      #     totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      #     dir_path: ./bin
      #     output_path: ./signed
      #     environment_name: PROD

      # - name: Move into the bin directory.
      #   shell: bash
      #   run: |
      #     ls -la
      #     sudo chown -R $(whoami) ./signed ./bin
      #     sudo chmod -R u+rw ./signed ./bin
      #     rm -rf ./signed/build_deps
      #     mv -f ./signed/* ./bin/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz -C ./bin .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}



      - name: Notify Cerebro of Build Success
        id: cerebro-notify-completed
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-notify-completed.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

  build-templates:
    runs-on: ${{ matrix.arm && 'ubuntu-22.04' || 'windows-latest' }}
    name: ${{ matrix.name }}
    needs: template-check
    if: ${{ contains(github.event.client_payload.build_type, 'templates') }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Template w/ Mono (64bit)
            cache-name: windows-template-mono-64bit
            target: template_release
            sconsflags: module_mono_enabled=yes arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: true

          - name: Template (64bit)
            cache-name: windows-template-64bit
            target: template_release
            sconsflags: arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: false

          - name: Template w/ Mono (64bit)
            cache-name: windows-debug-template-mono-64bit
            target: template_debug
            sconsflags: module_mono_enabled=yes arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: true

          - name: Template (64bit)
            cache-name: windows-debug-template-64bit
            target: template_debug
            sconsflags: arch=x86_64 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x64
            mono: false

          - name: Template w/ Mono (32bit)
            cache-name: windows-template-mono-32bit
            target: template_release
            sconsflags: module_mono_enabled=yes arch=x86_32 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: true

          - name: Template (32bit)
            cache-name: windows-template-32bit
            target: template_release
            sconsflags: arch=x86_32  ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: false

          - name: Template w/ Mono (32bit)
            cache-name: windows-debug-template-mono-32bit
            target: template_debug
            sconsflags: module_mono_enabled=yes arch=x86_32  ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: true

          - name: Template (32bit)
            cache-name: windows-debug-template-32bit
            target: template_debug
            sconsflags: arch=x86_32 ${{ github.event.client_payload.production && 'production=yes' || '' }}
            arch: x86
            mono: false

          - name: Template w/ Mono (arm64)
            cache-name: windows-template-mono-arm64
            target: template_release
            sconsflags: module_mono_enabled=yes arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none  
            mono: true
            arch: arm64
            arm: true

          - name: Template (arm64)
            cache-name: windows-template-arm64
            target: template_release
            sconsflags: arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none
            mono: false
            arch: arm64
            arm: true

          - name: Template w/ Mono (arm64)
            cache-name: windows-debug-template-mono-arm64
            target: template_debug
            sconsflags: module_mono_enabled=yes arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none
            mono: true
            arch: arm64
            arm: true

          - name: Template (arm64)
            cache-name: windows-debug-template-arm64
            target: template_debug
            sconsflags: arch=arm64 use_llvm=yes ${{ github.event.client_payload.production && 'production=yes' || '' }} lto=none
            mono: false
            arch: arm64
            arm: true

    steps:
      - name: Skip Action?
        shell: bash
        if: matrix.skip
        run: |
          echo "Skipping Build" >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Checkout CI actions
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          fetch-depth: 1

      - name: Reuse completed asset
        if: ${{ !matrix.skip && github.event.client_payload.force != true }}
        id: reuse
        uses: ./.github/actions/cerebro-reuse-assets
        with:
          names: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Checkout Repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ inputs.build_sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Remove existing workflows folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          rm -rf .github/workflows

      - name: Pull .github folder from ci_cd repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          rm -rf ci_cd_repo

      - name: Normalize path
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        id: normalize
        shell: bash
        run: |
          normalized_workspace="$(echo "${{ github.workspace }}" | sed 's|\\|/|g')"
          echo "normalized_workspace=$normalized_workspace" >> "$GITHUB_OUTPUT"

      - name: Update new Version Information to version.py
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/set-repos-version
        with:
          file_path: ${{ steps.normalize.outputs.normalized_workspace }}/version.py
          external_major: ${{ inputs.new_major }}
          external_minor: ${{ inputs.new_minor }}
          external_patch: ${{ inputs.new_patch }}
          external_status: ${{ inputs.external_status }}
          external_sha: ${{ inputs.build_sha }}

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: ${{ startsWith(matrix.target, 'template_') && 'Template' || 'Editor' }}
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: windows
          arch: ${{ contains(matrix.cache-name, '32bit') && 'x86_32' || (contains(matrix.cache-name, 'arm64') && 'arm64' || 'x86_64') }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Restore Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-deps

      - name: Install llvm-mingw
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: |
          curl -LO https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar xf llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          rm -f llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "MINGW_PREFIX=$(pwd)/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64" >> $GITHUB_ENV

      - name: Download and extract llvm-mingw SDK
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: |
          mkdir -p sdks
          cd sdks
          curl -LO https://github.com/mstorsjo/llvm-mingw/releases/download/20241015/llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz
          xz -dc llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz | tar -xvf -
          rm -f llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64.tar.xz
          echo "LLVM_MINGW=$(pwd)/llvm-mingw-20241015-msvcrt-ubuntu-20.04-x86_64" >> $GITHUB_ENV

      - name: Setup GCC problem matcher
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ammaraskar/gcc-problem-matcher@master

      - name: Download and extract mono-glue
        shell: bash
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          TYPE=${{ inputs.external_status }}
          REF=${{ inputs.engine_reference }}
          URL="https://cdn.blazium.app/monoglue/${REF}/${TYPE}/monoglue-${TYPE}.tar.gz"
          
          # Download the file
          curl -L $URL -o monoglue.tar.gz

          # Extract the entire archive to a temporary directory
          mkdir -p temp_extract
          tar -xzvf monoglue.tar.gz -C temp_extract

          # Create target directories if they don't exist
          mkdir -p modules/mono/glue/GodotSharp/GodotSharp
          mkdir -p modules/mono/glue/GodotSharp/GodotSharpEditor

          # Move the extracted folders to their target locations

          cp -r temp_extract/GodotSharp/* modules/mono/glue/GodotSharp/GodotSharp/
          cp -r temp_extract/GodotSharpEditor/* modules/mono/glue/GodotSharp/GodotSharpEditor/

          ls -la ./modules/mono/glue/GodotSharp/GodotSharp/
          ls -la ./modules/mono/glue/GodotSharp/GodotSharpEditor/

          # Clean up the temporary directory
          rm -rf temp_extract monoglue.tar.gz



      - name: Download Direct3D 12 SDK components
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download Direct3D 12 SDK components (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download pre-built ANGLE static libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-${{ matrix.arch == 'x86' && 'x86_32' || (matrix.arch == 'arm64' && 'arm64' || 'x86_64') }}-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built ANGLE static libraries (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-arm64-llvm-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries (ARM cross)
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.arm) }}
        shell: bash
        run: unzip -o angle/angle.zip -d .

      - name: Download Mesa Libraries
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/download-mesa-action
        with:
          mesa_url_base: "https://github.com/godotengine/godot-nir-static/releases/download/23.1.9-1/godot-nir-static"
          mesa_folder: "${{ steps.normalize.outputs.normalized_workspace }}/deps/mesa"
          variant: ${{ matrix.arm && 'llvm' || 'msvc' }}
          architectures: ${{ matrix.arm && 'arm64' || 'x86_64,x86_32,arm64' }}

      - name: Setup MSVC
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (!matrix.arm) }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86' && 'amd64_x86' || matrix.arch }}

      - name: Compilation
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ matrix.sconsflags }} ${{ env.SCONSFLAGS }} ${{ github.event.client_payload.production && '' || env.DEBUG_SCONSFLAGS }} "mesa_libs=${{ steps.normalize.outputs.normalized_workspace }}/deps/mesa"
          platform: windows
          target: ${{ matrix.target }}
          build-name: blazium
          scons-cache: "${{ github.workspace }}/.scons_cache/"

      - name: Save Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        shell: bash
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz -C ./bin .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}



      - name: Notify Cerebro of Build Success
        id: cerebro-notify-completed
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-notify-completed.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

  template-success:
    name: Template Success
    needs: build-templates
    runs-on: ubuntu-latest
    steps:

      - name: Create build.sha for Version Verification Later
        run: |
          echo ${{ inputs.build_sha }} >> build.sha

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: build.sha
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/template

  editor-success:
    name: Editor Success
    needs: build-editors
    runs-on: ubuntu-latest
    steps:

      - name: Create build.sha for Version Verification Later
        run: |
          echo ${{ inputs.build_sha }} >> build.sha

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: build.sha
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}

