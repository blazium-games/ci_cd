name: Deploy Editors to Walled Gardens
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string
      monoglue-build:
        description: "Build Status for Monoglue"
        required: true
        type: string
      windows-build:
        description: "Build Status for Windows"
        required: true
        type: string
      macos-build:
        description: "Build Status for MacOS"
        required: true
        type: string
      linux-build:
        description: "Build Status for Linux"
        required: true
        type: string
      android-build:
        description: "Build Status for Android"
        required: true
        type: string
      web-build:
        description: "Build Status for Web"
        required: false
        default: ""
        type: string
      release_url:
        description: "Release URL to upload files to the Release URL"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BASE_NAME: BlaziumEditor_v${{ inputs.new_version }}

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-editor-deploy
  cancel-in-progress: true

jobs:
  do-we-deploy-lol:
    name: Should we Deploy, to Walled Gardens? 
    if: github.event.client_payload.run_id || contains(github.event.client_payload.build, 'macos')
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Print Inputs and Initial Debugging
        run: |
          echo "Client Payload Force: ${{ github.event.client_payload.force }}"
          echo "Inputs:"
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}"
          echo "  - windows-build: ${{ inputs.windows-build }}"
          echo "  - macos-build: ${{ inputs.macos-build }}"
          echo "  - linux-build: ${{ inputs.linux-build }}"
          echo "  - android-build: ${{ inputs.android-build }}"
          echo "  - web-build: ${{ inputs.web-build }}"
          echo "--- End of Inputs ---"

      - name: Are we Deploying?
        id: evaluate
        run: |
          BUILD="${{ join(github.event.client_payload.build, ',') }}"

          requested() {
            printf '%s\n' "$BUILD" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$1"
          }

          platform_ok() {
            local platform="$1"
            local result="$2"
            if requested "$platform"; then
              if [ "$result" != "success" ]; then
                echo "Requested platform $platform result=$result (need success)." >> $GITHUB_STEP_SUMMARY
                return 1
              fi
            fi
            return 0
          }

          echo "Evaluating Deployment Condition..." >> $GITHUB_STEP_SUMMARY
          echo "build: $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "deploy: ${{ join(github.event.client_payload.deploy, ',') }}" >> $GITHUB_STEP_SUMMARY
          echo "monoglue-build=${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "windows-build=${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "macos-build=${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "linux-build=${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "android-build=${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "web-build=${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.client_payload.force }}" == "true" ]]; then
            echo "Force deploy is true. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.client_payload.run_id }}" ]]; then
            echo "Resuming prior run_id. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif platform_ok monoglue "${{ inputs.monoglue-build }}" &&
               platform_ok windows "${{ inputs.windows-build }}" &&
               platform_ok macos "${{ inputs.macos-build }}" &&
               platform_ok linux "${{ inputs.linux-build }}" &&
               platform_ok android "${{ inputs.android-build }}" &&
               platform_ok web "${{ inputs.web-build }}"; then
            echo "Requested builds succeeded. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "A requested build failed or was cancelled. Refusing deploy." >> $GITHUB_STEP_SUMMARY
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log Outputs to Step Summary
        if: always()
        run: |
          echo "### Debugging Outputs" >> $GITHUB_STEP_SUMMARY
          echo "Client Payload Force: ${{ github.event.client_payload.force }}" >> $GITHUB_STEP_SUMMARY
          echo "Inputs:" >> $GITHUB_STEP_SUMMARY
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - windows-build: ${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - macos-build: ${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - linux-build: ${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - android-build: ${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - web-build: ${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY
          echo "Proceed Output: ${{ steps.evaluate.outputs.proceed }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if we cannot deploy
        if: steps.evaluate.outputs.proceed != 'true'
        run: |
          echo "Deploy gate refused to proceed." >> $GITHUB_STEP_SUMMARY
          exit 1

  deploy-mac-appstore:
    runs-on: macos-15
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          submodules: recursive

      - name: Select Xcode 16.2
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify Xcode selection
        run: |
          xcode-select -p
          xcodebuild -version
      
      - name: Download Editor
        uses: ./.github/actions/cerebro-download-multi-build
        with:
          names: |
            macos-editor-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          folder: ${{ github.workspace }}/downloads
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
      
      - name: Uncompress Templates
        uses: ./.github/actions/multi-uncompress-tar-gz
        with:
          names: |
            macos-editor-${{ inputs.external_status }}
          input_dir: ${{ github.workspace }}/downloads
          output_dir: ${{ github.workspace }}/extracted

      - name: Extract Blazium.
        working-directory: extracted/macos-editor-${{ inputs.external_status }}
        run: |
          ls
          unzip -o Blazium_macos.universal.zip
          ls
          # output should be Blazium.app
          mv Blazium.app ../Blazium.app

      # https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Install the Apple certificate and provisioning profile
        working-directory: extracted
        env:
          DEPLOY_CERTIFICATE_BASE64: ${{ secrets.DEPLOY_CERTIFICATE_BASE64 }}
          INSTALL_CERTIFICATE_BASE64: ${{ secrets.INSTALL_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEPLOY_PROVISION_PROFILE_MAC_BASE64: ${{ secrets.DEPLOY_PROVISION_PROFILE_MAC_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          DEPLOY_CERTIFICATE_PATH=$RUNNER_TEMP/deploy_certificate.p12
          INSTALL_CERTIFICATE_PATH=$RUNNER_TEMP/install_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$DEPLOY_CERTIFICATE_BASE64" | base64 --decode -o $DEPLOY_CERTIFICATE_PATH
          echo -n "$INSTALL_CERTIFICATE_BASE64" | base64 --decode -o $INSTALL_CERTIFICATE_PATH
          echo -n "$DEPLOY_PROVISION_PROFILE_MAC_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          # Import first certificate
          security import $DEPLOY_CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          SIGNING_IDENTITY=$(security find-identity -p basic -v | awk -F'"' 'NR==1 {print $2}')
          echo "DEPLOY_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          # Capture list of identities before second import
          IDENTITIES_BEFORE=$(security find-identity -p basic -v | awk -F'"' '{print $2}')

          # Import second certificate
          security import $INSTALL_CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -p basic -v
          # Capture list of identities after second import
          IDENTITIES_AFTER=$(security find-identity -p basic -v | awk -F'"' '{print $2}')

          # Find the new identity added (difference between after and before)
          SECOND_SIGNING_IDENTITY=$(comm -13 <(echo "$IDENTITIES_BEFORE" | sort) <(echo "$IDENTITIES_AFTER" | sort) | head -n 1)

          # Export to GitHub Actions environment
          echo "INSTALL_SIGNING_IDENTITY=$SECOND_SIGNING_IDENTITY" >> $GITHUB_ENV
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          cp $PP_PATH Blazium.app/Contents/embedded.provisionprofile
          # Set apple team id in entitlements
          sed -i '' -e "s/APPLE_TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" ../deploy/macos/deploy.entitlements
          plutil ../deploy/macos/deploy.entitlements
          cat ../deploy/macos/deploy.entitlements

      - name: Code Sign
        working-directory: extracted
        run: |
          # Remove wrong attributes, these could be quarantine attibutes.
          xattr -cr Blazium.app

          codesign --force --options=runtime --verbose --timestamp \
            --entitlements ../deploy/macos/deploy.entitlements --sign "$DEPLOY_SIGNING_IDENTITY" \
            Blazium.app
      
      - name: Make installer
        working-directory: extracted
        run: |
          productbuild --sign "$INSTALL_SIGNING_IDENTITY" \
          --component Blazium.app /Applications Blazium.pkg
      
      - name: Deploy installer
        working-directory: extracted
        run: |
          xcrun altool --upload-app --type osx --file Blazium.pkg \
          --username "${{ secrets.APPLE_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --verbose
