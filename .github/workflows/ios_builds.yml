name: 🍏 iOS Builds
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_major:
        description: "New Major # for Version"
        required: true
        type: string
      new_minor:
        description: "New Minor # for Version"
        required: true
        type: string
      new_patch:
        description: "New Patch # for Version"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BLAZIUM_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  EDITOR_BUILD_ID: ${{ inputs.build_sha }}
  SCONSFLAGS: verbose=yes warnings=no progress=no
  TERM: xterm
  DEPLOY_TYPE: ios

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-ios
  cancel-in-progress: true

jobs:

  template-check:
    name: Checking Templates build.sha
    if: contains(github.event.client_payload.build_type, 'templates')
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.compile.outputs.should_compile == 'true' }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          
          fetch-depth: 1

      - name: Compilation
        if: ${{ github.event.client_payload.force != true }}
        id: compile
        uses: ./.github/actions/version-checker
        with:
          deploy_type: ${{ env.DEPLOY_TYPE }}
          build_type: ${{ inputs.external_status }}
          engine_reference: ${{ inputs.engine_reference }}
          build_sha: ${{ inputs.build_sha }}
          is_template: 'true'

  build-templates:
    runs-on: macos-15
    name: Building ${{ matrix.name }}
    needs: template-check
    if: ${{ contains(github.event.client_payload.build_type, 'templates') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Template
            cache-name: ios-template
            sconsflags: ${{ github.event.client_payload.production && 'production=yes use_lto=no' || '' }}
            mono: false

          - name: Template/w MONO
            cache-name: ios-template-mono
            sconsflags: ${{ github.event.client_payload.production && 'production=yes use_lto=no' || '' }}
            mono: true


    steps:
      - name: Checkout CI actions
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          fetch-depth: 1

      - name: Reuse completed asset
        if: ${{ !matrix.skip && github.event.client_payload.force != true }}
        id: reuse
        uses: ./.github/actions/cerebro-reuse-assets
        with:
          names: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Checkout Repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ inputs.build_sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Remove existing workflows folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf .github/workflows

      - name: Pull .github folder from ci_cd repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          git -C ci_cd_repo fetch --depth=1 origin ${{ github.sha }}
          git -C ci_cd_repo checkout ${{ github.sha }}
          cp -r ci_cd_repo/.github/* .github/
          rm -rf ci_cd_repo

      - name: Install sevenzip
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: brew install sevenzip

      - name: Update new Version Information to version.py
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/set-repos-version
        with:
          file_path: ${{ github.workspace }}/version.py
          external_major: ${{ inputs.new_major }}
          external_minor: ${{ inputs.new_minor }}
          external_patch: ${{ inputs.new_patch }}
          external_status: ${{ inputs.external_status }}
          external_sha: ${{ inputs.build_sha }}

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Template
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: ios
          arch: arm64
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}


      - name: Select Xcode 16.2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify Xcode selection
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Download and extract MoltenVK
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          mkdir -p deps/moltenvk
          pushd deps/moltenvk
          curl -L -o moltenvk.tar https://github.com/godotengine/moltenvk-osxcross/releases/download/vulkan-sdk-1.3.283.0-2/MoltenVK-all.tar
          tar xf moltenvk.tar && rm -f moltenvk.tar
          mv MoltenVK/MoltenVK/include/ MoltenVK/
          mv MoltenVK/MoltenVK/static/MoltenVK.xcframework/ MoltenVK/
          popd
          
      - name: Setup Vulkan SDK
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh

      - name: Restore Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-deps

      - name: Download and extract mono-glue
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          TYPE=${{ inputs.external_status }}
          REF=${{ inputs.engine_reference }}
          URL="https://cdn.blazium.app/monoglue/${REF}/${TYPE}/monoglue-${TYPE}.tar.gz"
          
          # Download the file
          curl -L $URL -o monoglue.tar.gz

          # Extract the entire archive to a temporary directory
          mkdir -p temp_extract
          tar -xzvf monoglue.tar.gz -C temp_extract

          # Create target directories if they don't exist
          mkdir -p modules/mono/glue/GodotSharp/GodotSharp
          mkdir -p modules/mono/glue/GodotSharp/GodotSharpEditor

          # Move the extracted folders to their target locations
          rsync -av temp_extract/GodotSharp/ modules/mono/glue/GodotSharp/GodotSharp/
          rsync -av temp_extract/GodotSharpEditor/ modules/mono/glue/GodotSharp/GodotSharpEditor/

          ls -la ./modules/mono/glue/GodotSharp/GodotSharp/
          ls -la ./modules/mono/glue/GodotSharp/GodotSharpEditor/

          # Clean up the temporary directory
          rm -rf temp_extract monoglue.tar.gz
      
      - name: Compilation (template_release, arm64)
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: arch=arm64 ios_simulator=no ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }}
          platform: ios
          target: template_release
          tests: false

      - name: Compilation (template_debug, arm64)
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: arch=arm64 ios_simulator=no ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }}
          platform: ios
          target: template_debug
          tests: false

      - name: Compilation (template_release, x86_64)
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: arch=x86_64 ios_simulator=yes ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }}
          platform: ios
          target: template_release
          tests: false

      - name: Compilation (template_debug, x86_64)
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: arch=x86_64 ios_simulator=yes ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }}
          platform: ios
          target: template_debug
          tests: false

      - name: Save Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-save
        continue-on-error: true

      - name: Setup Template
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
            mkdir -p ./ios/${{ inputs.external_status }}/templates
            cp bin/libgodot.ios.template_release.arm64.a ./ios/${{ inputs.external_status }}/templates/libgodot.ios.a
            cp bin/libgodot.ios.template_debug.arm64.a ./ios/${{ inputs.external_status }}/templates/libgodot.ios.debug.a
            cp bin/libgodot.ios.template_release.x86_64.simulator.a ./ios/${{ inputs.external_status }}/templates/libgodot.ios.simulator.a
            cp bin/libgodot.ios.template_debug.x86_64.simulator.a ./ios/${{ inputs.external_status }}/templates/libgodot.ios.debug.simulator.a

      - name: Create Template
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf ios_xcode
          HERE=$(pwd)
          cp -r misc/dist/ios_xcode ios_xcode
          cp "./ios/${{ inputs.external_status }}/templates/libgodot.ios.simulator.a" ios_xcode/libgodot.ios.release.xcframework/ios-arm64_x86_64-simulator/libgodot.a
          cp "./ios/${{ inputs.external_status }}/templates/libgodot.ios.debug.simulator.a" ios_xcode/libgodot.ios.debug.xcframework/ios-arm64_x86_64-simulator/libgodot.a
          cp "./ios/${{ inputs.external_status }}/templates/libgodot.ios.a" ios_xcode/libgodot.ios.release.xcframework/ios-arm64/libgodot.a
          cp "./ios/${{ inputs.external_status }}/templates/libgodot.ios.debug.a" ios_xcode/libgodot.ios.debug.xcframework/ios-arm64/libgodot.a
          cp -r deps/moltenvk/MoltenVK/MoltenVK.xcframework ios_xcode/
          rm -rf ios_xcode/MoltenVK.xcframework/{macos,tvos}*
          cd ios_xcode
          bash "${GITHUB_WORKSPACE}/.github/scripts/create_zip.sh" "${HERE}/${{ matrix.cache-name }}-${{ inputs.external_status }}.zip" *
          cd "${HERE}"
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz ${{ matrix.cache-name }}-${{ inputs.external_status }}.zip

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/template


      - name: Notify Cerebro of Build Success
        id: cerebro-notify-completed
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/template/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-notify-completed.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

  template-success:
    name: Template Success
    needs: build-templates
    runs-on: ubuntu-latest
    steps:

      - name: Create build.sha for Version Verification Later
        run: |
          echo ${{ inputs.build_sha }} >> build.sha

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: build.sha
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/template
