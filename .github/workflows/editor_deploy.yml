name: Editor Deploy
on:
  workflow_call:
    outputs:
      deployed:
        description: Whether Editor Deploy actually signed and uploaded
        value: ${{ jobs.deploy-editors.result == 'success' }}
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string
      monoglue-build:
        description: "Build Status for Monoglue"
        required: true
        type: string
      windows-build:
        description: "Build Status for Windows"
        required: true
        type: string
      macos-build:
        description: "Build Status for MacOS"
        required: true
        type: string
      linux-build:
        description: "Build Status for Linux"
        required: true
        type: string
      android-build:
        description: "Build Status for Android"
        required: true
        type: string
      web-build:
        description: "Build Status for Web"
        required: false
        default: ""
        type: string
      release_url:
        description: "Release URL to upload files to the Release URL"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BASE_NAME: BlaziumEditor_v${{ inputs.new_version }}

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-editor-deploy
  cancel-in-progress: true

jobs:
  do-we-deploy-lol:
    name: Should we Deploy, the Editors?
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Print Inputs and Initial Debugging
        run: |
          echo "Client Payload Force: ${{ github.event.client_payload.force }}"
          echo "Inputs:"
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}"
          echo "  - windows-build: ${{ inputs.windows-build }}"
          echo "  - macos-build: ${{ inputs.macos-build }}"
          echo "  - linux-build: ${{ inputs.linux-build }}"
          echo "  - android-build: ${{ inputs.android-build }}"
          echo "  - web-build: ${{ inputs.web-build }}"
          echo "--- End of Inputs ---"

      - name: Are we Deploying?
        id: evaluate
        run: |
          BUILD="${{ join(github.event.client_payload.build, ',') }}"

          requested() {
            printf '%s\n' "$BUILD" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$1"
          }

          platform_ok() {
            local platform="$1"
            local result="$2"
            if requested "$platform"; then
              if [ "$result" != "success" ]; then
                echo "Requested platform $platform result=$result (need success)." >> $GITHUB_STEP_SUMMARY
                return 1
              fi
            fi
            return 0
          }

          echo "Evaluating Deployment Condition..." >> $GITHUB_STEP_SUMMARY
          echo "build: $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "deploy: ${{ join(github.event.client_payload.deploy, ',') }}" >> $GITHUB_STEP_SUMMARY
          echo "monoglue-build=${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "windows-build=${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "macos-build=${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "linux-build=${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "android-build=${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "web-build=${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event.client_payload.force }}" == "true" ]]; then
            echo "Force deploy is true. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.client_payload.run_id }}" ]]; then
            echo "Resuming prior run_id. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif platform_ok monoglue "${{ inputs.monoglue-build }}" &&
               platform_ok windows "${{ inputs.windows-build }}" &&
               platform_ok macos "${{ inputs.macos-build }}" &&
               platform_ok linux "${{ inputs.linux-build }}" &&
               platform_ok android "${{ inputs.android-build }}" &&
               platform_ok web "${{ inputs.web-build }}"; then
            echo "Requested builds succeeded. Proceeding." >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "A requested build failed or was cancelled. Refusing deploy." >> $GITHUB_STEP_SUMMARY
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log Outputs to Step Summary
        if: always()
        run: |
          echo "### Debugging Outputs" >> $GITHUB_STEP_SUMMARY
          echo "Client Payload Force: ${{ github.event.client_payload.force }}" >> $GITHUB_STEP_SUMMARY
          echo "Inputs:" >> $GITHUB_STEP_SUMMARY
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - windows-build: ${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - macos-build: ${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - linux-build: ${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - android-build: ${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - web-build: ${{ inputs.web-build }}" >> $GITHUB_STEP_SUMMARY
          echo "Proceed Output: ${{ steps.evaluate.outputs.proceed }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if we cannot deploy
        if: steps.evaluate.outputs.proceed != 'true'
        run: |
          echo "Deploy gate refused to proceed." >> $GITHUB_STEP_SUMMARY
          exit 1

  deploy-editors:
    runs-on:  
      group: release-builder
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    name: Editor Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve deploy platforms
        id: platforms
        uses: ./.github/actions/resolve-deploy-platforms
        with:
          build: ${{ join(github.event.client_payload.build, ',') }}
          run_id: ${{ github.event.client_payload.run_id }}

      - name: Resolve editor artifact names
        id: artifacts
        uses: ./.github/actions/resolve-editor-artifacts
        with:
          suffix: ${{ inputs.external_status }}
          base_name: ${{ env.BASE_NAME }}
          editors_dir: ${{ github.workspace }}/editors
          linux: ${{ steps.platforms.outputs.linux }}
          macos: ${{ steps.platforms.outputs.macos }}
          windows: ${{ steps.platforms.outputs.windows }}
          android: ${{ steps.platforms.outputs.android }}
          web: ${{ steps.platforms.outputs.web }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # Keep the locally built sslcom-code-signer image. Pruning it makes
          # later docker run treat the short tag as a Hub repo and fail.
          docker-images: false
          swap-storage: true

      - name: Install and Verify Butler
        run: |
          curl -L -o butler.zip https://github.com/itchio/butler/releases/download/v15.26.1/butler-linux-amd64.zip
          unzip butler.zip
          chmod +x linux-amd64/butler
          echo "$PWD/linux-amd64" >> $GITHUB_PATH
          linux-amd64/butler -V

      - name: Download Editor Files
        uses: ./.github/actions/cerebro-download-multi-build
        with:
          names: ${{ steps.artifacts.outputs.names }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          folder: ${{ github.workspace }}/downloads
          run_id: ${{ inputs.runner_id }}
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}

      - name: Uncompress Editors
        uses: ./.github/actions/multi-uncompress-tar-gz
        with:
          names: ${{ steps.artifacts.outputs.names }}
          input_dir: ${{ github.workspace }}/downloads
          output_dir: ${{ github.workspace }}/extracted

      - name: Edit Editor Filenames in-Place
        uses: ./.github/actions/multi-rename-inplace
        with:
          names: ${{ steps.artifacts.outputs.rename_names }}
          filename_old: ${{ steps.artifacts.outputs.rename_old }}
          filename_new: ${{ steps.artifacts.outputs.rename_new }}
          input_dir: ${{ github.workspace }}/extracted

      - name: Delete Editor Filenames/Folders in-Place
        uses: ./.github/actions/multi-delete-inplace
        with:
          names: ${{ steps.artifacts.outputs.names }}
          input_dir: ${{ github.workspace }}/extracted
          items_to_delete: |
            build_deps/
            obj/
            *.pdb
            *.exp
            *.lib
            .web_zip/

      # Sign Windows .exe trees with SSL.com (same inputs as windows_builds.yml), then merge outputs before zip.
      - name: Verify Windows editor folders exist
        if: steps.platforms.outputs.windows == 'true'
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="${GITHUB_WORKSPACE}/extracted"
          SUFFIX="${{ inputs.external_status }}"
          for base in \
            windows-editor-mono-64bit \
            windows-editor-64bit \
            windows-editor-mono-32bit \
            windows-editor-32bit \
            windows-editor-arm64 \
            windows-editor-mono-arm64
          do
            DIR="${INPUT_DIR}/${base}-${SUFFIX}"
            if [ ! -d "$DIR" ]; then
              echo "::error::Missing Windows editor folder: $DIR"
              exit 1
            fi
          done
          echo "All six Windows editor folders present under ${INPUT_DIR}"

      - name: Sign windows-editor-mono-64bit
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-mono-64bit-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-mono-64bit-${{ inputs.external_status }}
          environment_name: PROD

      - name: Sign windows-editor-64bit
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-64bit-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-64bit-${{ inputs.external_status }}
          environment_name: PROD

      - name: Sign windows-editor-mono-32bit
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-mono-32bit-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-mono-32bit-${{ inputs.external_status }}
          environment_name: PROD

      - name: Sign windows-editor-32bit
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-32bit-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-32bit-${{ inputs.external_status }}
          environment_name: PROD

      - name: Sign windows-editor-arm64
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-arm64-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-arm64-${{ inputs.external_status }}
          environment_name: PROD

      - name: Sign windows-editor-mono-arm64
        if: steps.platforms.outputs.windows == 'true'
        uses: bioblaze/sslcom-code-signer@v6
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/extracted/windows-editor-mono-arm64-${{ inputs.external_status }}
          output_path: ${{ github.workspace }}/extracted/.__sign_out/windows-editor-mono-arm64-${{ inputs.external_status }}
          environment_name: PROD

      - name: Move signed Windows outputs into editor folders
        if: steps.platforms.outputs.windows == 'true'
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="${GITHUB_WORKSPACE}/extracted"
          SUFFIX="${{ inputs.external_status }}"
          for base in \
            windows-editor-mono-64bit \
            windows-editor-64bit \
            windows-editor-mono-32bit \
            windows-editor-32bit \
            windows-editor-arm64 \
            windows-editor-mono-arm64
          do
            SRC="${INPUT_DIR}/.__sign_out/${base}-${SUFFIX}"
            DST="${INPUT_DIR}/${base}-${SUFFIX}"
            if [ ! -d "$SRC" ]; then
              echo "::error::Expected signed output directory missing: $SRC"
              exit 1
            fi
            # Signer container writes as root; merge and delete with sudo.
            sudo rm -rf "${SRC}/build_deps" "${DST}/build_deps"
            sudo cp -a "${SRC}/." "${DST}/"
            sudo rm -rf "$SRC"
            sudo chown -R "$(id -u):$(id -g)" "$DST"
          done
          sudo rm -rf "${INPUT_DIR}/.__sign_out"
          echo "Merged signed Windows binaries back into editor folders."

      - name: Rename Folders then Zip/Move Folders
        uses: ./.github/actions/multi-folder-zip
        with:
          names: ${{ steps.artifacts.outputs.zip_names }}
          filename_new: ${{ steps.artifacts.outputs.zip_new }}
          input_dir: ${{ github.workspace }}/extracted
          output_dir: ${{ github.workspace }}/editors

      - name: Generate Checksums for Editors
        uses: ./.github/actions/checksum-txt-generator
        with:
          directory: ${{ github.workspace }}/editors

      - name: Generate JSON with File Info and Checksums
        shell: bash
        env:
          BASE_NAME: ${{ env.BASE_NAME }}
          URL_BASE: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}
          ZIP_FILES: ${{ steps.artifacts.outputs.zip_files }}
          ENGINE_REFERENCE: ${{ inputs.engine_reference }}
          GODOT_LINE: ${{ inputs.godot_line }}
          CHANNEL: ${{ inputs.external_status }}
          VERSION: ${{ inputs.new_version }}
        run: |
          # Define the editors directory and output file
          EDITORS_DIR="${GITHUB_WORKSPACE}/editors"
          OUTPUT_FILE="${EDITORS_DIR}/editors.json"

          # Ensure the directory exists
          if [ ! -d "$EDITORS_DIR" ]; then
            echo "Error: Directory $EDITORS_DIR does not exist."
            exit 1
          fi

          # Initialize JSON array
          JSON_ARRAY="[]"

          mapfile -t FILE_NAMES < <(printf '%s\n' "$ZIP_FILES" | awk NF)

          # Process each file
          for FILE_NAME in "${FILE_NAMES[@]}"; do
            FILE_PATH="${EDITORS_DIR}/${FILE_NAME}"

            if [ -f "$FILE_PATH" ]; then
              # Compute file details
              FILE_SHA512=$(sha512sum "$FILE_PATH" | awk '{print $1}')
              FILE_SHA256=$(sha256sum "$FILE_PATH" | awk '{print $1}')
              FILE_SIZE=$(stat -c%s "$FILE_PATH")
              FILE_TIMESTAMP=$(date -r "$FILE_PATH" +"%Y-%m-%dT%H:%M:%SZ")

              # Append details to JSON array
              JSON_ARRAY=$(echo "$JSON_ARRAY" | jq \
                --arg name "$FILE_NAME" \
                --arg sha512 "$FILE_SHA512" \
                --arg sha256 "$FILE_SHA256" \
                --arg size "$FILE_SIZE" \
                --arg url "${URL_BASE}/$FILE_NAME" \
                --arg timestamp "$FILE_TIMESTAMP" \
                --arg reference "$ENGINE_REFERENCE" \
                --arg godot "$GODOT_LINE" \
                '. + [{
                  "filename": $name,
                  "download_url": $url,
                  "sha512": $sha512,
                  "sha256": $sha256,
                  "size": ($size | tonumber),
                  "timestamp": $timestamp,
                  "reference": $reference,
                  "godot": $godot
                }]'
              )
            else
              echo "Warning: File $FILE_PATH does not exist. Skipping." >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Save JSON array to file
          echo "$JSON_ARRAY" > "$OUTPUT_FILE"
          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg reference "$ENGINE_REFERENCE" \
            --arg godot "$GODOT_LINE" \
            '{version: $version, channel: $channel, reference: $reference, godot: $godot}' \
            > "${EDITORS_DIR}/line.json"

          # Log the generated JSON
          echo "Generated JSON file: $OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY
          echo "Contents:" >> $GITHUB_STEP_SUMMARY
          cat "$OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY

      - uses: ./.github/actions/multi-do-upload
        name: Upload Editors to CDN
        with:
          files: ${{ steps.artifacts.outputs.upload_files }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_path: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - uses: ./.github/actions/multi-itch.io-upload
        if: steps.platforms.outputs.linux == 'true' || steps.platforms.outputs.windows == 'true' || steps.platforms.outputs.macos == 'true'
        name: Upload Editors to Itch.io
        with:
          names: ${{ steps.artifacts.outputs.itch_files }}
          itch_username: blaziumengine
          itch_game: blazium-engine
          version: ${{ inputs.new_version }}
          tag: ${{ inputs.external_status }}
          butler_credentials: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Upload assets to GitHub release
        continue-on-error: ${{ github.event.client_payload.run_id != '' }}
        uses: ./.github/actions/upload-github-release
        with:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_PAT }}
          UPLOAD_URL: ${{ inputs.release_url }}
          FILES: ${{ steps.artifacts.outputs.github_files }}
          DEBUG: "true"
