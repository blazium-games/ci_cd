name: Cleanup
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      monoglue-build:
        description: "Build Status"
        required: true
        type: string
      windows-build:
        description: "Build Status"
        required: true
        type: string
      macos-build:
        description: "Build Status"
        required: true
        type: string
      linux-build:
        description: "Build Status"
        required: true
        type: string
      android-build:
        description: "Build Status"
        required: true
        type: string
      ios-build:
        description: "Build Status"
        required: true
        type: string
      new_major:
        description: "New Major # for Version"
        required: true
        type: string
      new_minor:
        description: "New Minor # for Version"
        required: true
        type: string
      new_patch:
        description: "New Patch # for Version"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string
        
# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-cleanup
  cancel-in-progress: true

jobs:
  build-monoglue:
    runs-on: "ubuntu-22.04"
    name: Example for Clean up
    steps:

      - name: Testing
        run: |
          echo "Testing"