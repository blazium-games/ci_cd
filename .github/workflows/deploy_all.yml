name: 🔗 Deploy Templates & Editors
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      monoglue-build:
        description: "Build Status"
        required: true
        type: string
      windows-build:
        description: "Build Status"
        required: true
        type: string
      macos-build:
        description: "Build Status"
        required: true
        type: string
      linux-build:
        description: "Build Status"
        required: true
        type: string
      android-build:
        description: "Build Status"
        required: true
        type: string
      ios-build:
        description: "Build Status"
        required: true
        type: string
      web-build:
        description: "Build Status"
        required: false
        default: ""
        type: string
      new_major:
        description: "New Major # for Version"
        required: true
        type: string
      new_minor:
        description: "New Minor # for Version"
        required: true
        type: string
      new_patch:
        description: "New Patch # for Version"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string

env:
  BASE_NAME: Blazium_v
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}

concurrency:
  group: ci-${{ github.actor }}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-deploy-all
  cancel-in-progress: true

jobs:

  changelog-deploy:
    name: Changelog Generation
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.createRelease.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ github.event.client_payload.branch || env.GODOT_BASE_BRANCH }}
          fetch-depth: 2

      - name: Pull .github folder from ci_cd repository
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          mv ci_cd_repo/cicd ./
          rm -rf ci_cd_repo

      - name: Get Latest Commit SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Parse version.py
        id: version
        uses: ./.github/actions/get-repos-version
        with:
          file_path: version.py

      - name: Generate Changelog.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: blazium-games
          GITHUB_REPO: blazium
          BASE_BRANCH: ${{ steps.version.outputs.external_sha }}
          CURRENT_BRANCH: ${{ steps.get_sha.outputs.sha }}
          MAJOR_VERSION: ${{ inputs.new_major }}
          MINOR_VERSION: ${{ inputs.new_minor }}
          PATCH_VERSION: ${{ inputs.new_patch }}
          BUILD_TYPE: ${{ inputs.external_status }}
          # Do not re-bump: inputs.new_* already came from runner.yml changelog pass (issue #716).
          FREEZE_VERSION: "1"
        run: |
          node ./cicd/scripts/changelog.js $(pwd)

      - name: Assert changelog version matches release tag
        env:
          EXPECTED_VERSION: ${{ inputs.new_version }}
        run: |
          ACTUAL=$(node -e "const v=require('./changelog.json').version; process.stdout.write([v.major,v.minor,v.patch].join('.'))")
          echo "Expected: ${EXPECTED_VERSION}"
          echo "Actual:   ${ACTUAL}"
          if [ "$ACTUAL" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: changelog.json version (${ACTUAL}) does not match release version (${EXPECTED_VERSION})"
            exit 1
          fi

      - name: Generate changelog.txt
        id: changelog-txt
        run: |
          node ./cicd/scripts/changelog2txt.js $(pwd)/changelog.json

      - name: Generate changelog.html
        id: changelog-html
        run: |
          node ./cicd/scripts/changelog2html.js $(pwd)/changelog.json

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cicd/scripts/changelog.html
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cicd/scripts/changelog.txt
          out_dir: ${{ inputs.external_status }}/${{ inputs.new_version }}

      - name: Create GitHub Release
        continue-on-error: ${{ github.event.client_payload.run_id != '' }}
        id: createRelease
        uses: ./.github/actions/create-github-release
        with:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_PAT }}
          OWNER: blazium-games
          REPO: blazium
          TARGET_COMMIT: ${{ inputs.build_sha }}
          TAG_NAME: v${{ inputs.new_version }}${{ inputs.external_status != 'release' && format('-{0}', inputs.external_status) || '' }} 
          NAME: "[${{ inputs.external_status }}] Blazium Engine v${{ inputs.new_version }}"
          BODY_FILE: ${{ github.workspace }}/cicd/scripts/changelog_short.html
          DRAFT: false
          PRERELEASE: ${{ inputs.external_status == 'nightly' || inputs.external_status == 'prerelease' }}
          DEBUG: true

  template-deploy:
    name: 📊 Deploy Templates to CDN
    if: contains(github.event.client_payload.deploy, 'templates')
    needs: [changelog-deploy]
    uses: ./.github/workflows/template_deploy.yml
    secrets: inherit
    with:
      build_sha: ${{ inputs.build_sha }}
      runner_id: ${{ inputs.runner_id }}
      new_version: ${{ inputs.new_version }}
      external_status: ${{ inputs.external_status }}
      engine_reference: ${{ inputs.engine_reference }}
      godot_line: ${{ inputs.godot_line }}
      monoglue-build: ${{ inputs.monoglue-build }}
      windows-build: ${{ inputs.windows-build }}
      macos-build: ${{ inputs.macos-build }}
      linux-build: ${{ inputs.linux-build }}
      android-build: ${{ inputs.android-build }}
      ios-build: ${{ inputs.ios-build }}
      web-build: ${{ inputs.web-build }}
      release_url: ${{ needs.changelog-deploy.outputs.release_url }}


  editor-deploy:
    name: 📊 Deploy Editors to CDN
    if: contains(github.event.client_payload.deploy, 'editors')
    needs: [changelog-deploy]
    uses: ./.github/workflows/editor_deploy.yml
    secrets: inherit
    with:
      build_sha: ${{ inputs.build_sha }}
      runner_id: ${{ inputs.runner_id }}
      new_version: ${{ inputs.new_version }}
      external_status: ${{ inputs.external_status }}
      engine_reference: ${{ inputs.engine_reference }}
      godot_line: ${{ inputs.godot_line }}
      monoglue-build: ${{ inputs.monoglue-build }}
      windows-build: ${{ inputs.windows-build }}
      macos-build: ${{ inputs.macos-build }}
      linux-build: ${{ inputs.linux-build }}
      android-build: ${{ inputs.android-build }}
      web-build: ${{ inputs.web-build }}
      release_url: ${{ needs.changelog-deploy.outputs.release_url }}

  update-version:
    name: Update Version Publically
    needs: [editor-deploy, template-deploy, changelog-deploy]
    if: >-
      always() &&
      needs.changelog-deploy.result == 'success' &&
      (
        needs.editor-deploy.result == 'skipped' ||
        (needs.editor-deploy.result == 'success' && needs.editor-deploy.outputs.deployed == 'true')
      ) &&
      (
        needs.template-deploy.result == 'skipped' ||
        (needs.template-deploy.result == 'success' && needs.template-deploy.outputs.deployed == 'true')
      ) &&
      (needs.editor-deploy.result == 'success' || needs.template-deploy.result == 'success')
    runs-on: ubuntu-latest
    steps:

      - name: Pull .github folder from ci_cd repository
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github ./
          mv ci_cd_repo/cicd ./
          rm -rf ci_cd_repo

      - name: Update Cerebro of new Version
        id: new_version
        uses: ./.github/actions/cerebro-update-version
        with:
          version: ${{ inputs.new_version }}
          changelog_url: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}/changelog.txt
          deploy_type: ${{ inputs.external_status }}
          templates_url: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}/details.json
          version_url: ${{ secrets.CDN_URL }}/${{ inputs.external_status }}/${{ inputs.new_version }}/editors.json
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}


  platform-deploy:
    name: 📊 Deploy Editors to Platforms
    if: contains(github.event.client_payload.deploy, 'platforms')
    needs: [changelog-deploy, update-version, editor-deploy, template-deploy]
    uses: ./.github/workflows/platform_deploy.yml
    secrets: inherit
    with:
      build_sha: ${{ inputs.build_sha }}
      runner_id: ${{ inputs.runner_id }}
      new_version: ${{ inputs.new_version }}
      external_status: ${{ inputs.external_status }}
      engine_reference: ${{ inputs.engine_reference }}
      godot_line: ${{ inputs.godot_line }}
      monoglue-build: ${{ inputs.monoglue-build }}
      windows-build: ${{ inputs.windows-build }}
      macos-build: ${{ inputs.macos-build }}
      linux-build: ${{ inputs.linux-build }}
      android-build: ${{ inputs.android-build }}
      web-build: ${{ inputs.web-build }}
      release_url: ${{ needs.changelog-deploy.outputs.release_url }}


  walledgardens-deploy:
    name: 📊 Deploy Editors to Walled Gardens
    if: >
      contains(github.event.client_payload.deploy, 'walledgardens') &&
      (github.event.client_payload.run_id || contains(github.event.client_payload.build, 'macos'))
    needs: [changelog-deploy, update-version, editor-deploy, template-deploy]
    uses: ./.github/workflows/walledgardens_deploy.yml
    secrets: inherit
    with:
      build_sha: ${{ inputs.build_sha }}
      runner_id: ${{ inputs.runner_id }}
      new_version: ${{ inputs.new_version }}
      external_status: ${{ inputs.external_status }}
      engine_reference: ${{ inputs.engine_reference }}
      godot_line: ${{ inputs.godot_line }}
      monoglue-build: ${{ inputs.monoglue-build }}
      windows-build: ${{ inputs.windows-build }}
      macos-build: ${{ inputs.macos-build }}
      linux-build: ${{ inputs.linux-build }}
      android-build: ${{ inputs.android-build }}
      web-build: ${{ inputs.web-build }}
      release_url: ${{ needs.changelog-deploy.outputs.release_url }}
