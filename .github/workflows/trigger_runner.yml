name: Trigger Build

on:
  workflow_dispatch:
    inputs:
      production:
        description: 'Is this a production build?'
        required: true
        type: boolean
        default: false
      type:
        description: 'Deploy channel: release, prerelease, or nightly. A release build must set this to release; production=true does not change the version label.'
        required: true
        default: 'nightly'
      branch:
        description: 'Branch to build from'
        required: true
        default: 'blazium-dev'
      build_type:
        description: 'Build type (comma-separated list like templates, editors)'
        required: true
        type: string
        default: 'templates,editors'
      build:
        description: 'Platforms to build for (comma-separated list like linux, monoglue, ios, macos, android, web, windows)'
        required: true
        type: string
        default: 'linux,ios,macos,android,web,windows,monoglue'
      force:
        description: 'Force a full rebuild even when artifacts already exist'
        required: true
        type: boolean
        default: false
      run_id:
        description: 'Optional prior runner id to skip compile workflows and deploy those Cerebro rows'
        required: false
        type: string
        default: ''
      deploy:
        description: 'Deploy (comma-separated list like templates, editors)'
        required: true
        type: string
        default: 'templates,editors'

jobs:
  dispatch-event:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Send Repository Dispatch Event
        run: |
          # Convert the comma-separated string inputs into arrays
          build_type=$(printf '%s' '${{ inputs.build_type }}' | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          build=$(printf '%s' '${{ inputs.build }}' | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          if [ -z '${{ inputs.deploy }}' ]; then
            deploy='[]'
          else
            deploy=$(printf '%s' '${{ inputs.deploy }}' | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          fi
          run_id_json='null'
          if [ -n '${{ inputs.run_id }}' ]; then
            run_id_json=$(printf '%s' '${{ inputs.run_id }}' | jq -R -c .)
          fi
          echo $build_type
          echo $build
          echo $deploy
          echo $run_id_json
          # Send the repository dispatch event
          curl -X POST \
          -v \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.PRIVATE_GITHUB_PAT }}" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d "{
            \"event_type\": \"trigger_build\",
            \"client_payload\": {
              \"production\": ${{ inputs.production }},
              \"type\": \"${{ inputs.type }}\",
              \"branch\": \"${{ inputs.branch }}\",
              \"build_type\": $build_type,
              \"force\": ${{ inputs.force }},
              \"build\": $build,
              \"deploy\": $deploy,
              \"run_id\": $run_id_json
            }
          }"
