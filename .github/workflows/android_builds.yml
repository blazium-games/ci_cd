name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_major:
        description: "New Major # for Version"
        required: true
        type: string
      new_minor:
        description: "New Minor # for Version"
        required: true
        type: string
      new_patch:
        description: "New Patch # for Version"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string

      external_status:
        description: "Deploy channel stamped into the build (release, prerelease, nightly)"
        required: true
        type: string
      engine_reference:
        description: "Engine line reference (blazium-dev or blazium_4.8)"
        required: true
        type: string
      godot_line:
        description: "Godot line (4.3 or 4.8)"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  BLAZIUM_BASE_BRANCH: ${{ github.event.client_payload.branch || 'blazium-dev' }}
  EDITOR_BUILD_ID: ${{ inputs.build_sha }}
  SCONSFLAGS: verbose=yes warnings=no progress=no swappy=yes ${{ github.event.client_payload.production && 'production=yes' || '' }}
  BUILD_TYPE: ${{ inputs.external_status }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TSAN_OPTIONS: suppressions=misc/error_suppressions/tsan.txt
  TERM: 'xterm'
  DISPLAY: ':0'
  DEPLOY_TYPE: android
  GODOT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.GODOT_ANDROID_KEYSTORE_ALIAS }}
  GODOT_ANDROID_SIGN_KEYSTORE_BAS64: ${{ secrets.GODOT_ANDROID_SIGN_KEYSTORE_BAS64 }}
  GODOT_ANDROID_SIGN_PASSWORD: ${{ secrets.GODOT_ANDROID_SIGN_PASSWORD }}

concurrency:
  group: ci-${{github.actor}}-${{ inputs.engine_reference }}-${{ inputs.external_status }}-android
  cancel-in-progress: true

jobs:
  editor-check:
    name: Checking Editor build.sha
    if: contains(github.event.client_payload.build_type, 'editors')
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.compile.outputs.should_compile }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          
          fetch-depth: 1

      - name: Compilation
        if: ${{ github.event.client_payload.force != true }}
        id: compile
        uses: ./.github/actions/version-checker
        with:
          deploy_type: ${{ env.DEPLOY_TYPE }}
          build_type: ${{ inputs.external_status }}
          engine_reference: ${{ inputs.engine_reference }}
          build_sha: ${{ inputs.build_sha }}

  template-check:
    name: Checking Templates build.sha
    if: contains(github.event.client_payload.build_type, 'templates')
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.compile.outputs.should_compile == 'true' }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          
          fetch-depth: 1

      - name: Compilation
        if: ${{ github.event.client_payload.force != true }}
        id: compile
        uses: ./.github/actions/version-checker
        with:
          deploy_type: ${{ env.DEPLOY_TYPE }}
          build_type: ${{ inputs.external_status }}
          engine_reference: ${{ inputs.engine_reference }}
          build_sha: ${{ inputs.build_sha }}
          is_template: 'true'

  build-editors: 
    runs-on:  
      group: release-builder
    name: Building Development Android ${{ matrix.name }}
    needs: editor-check
    if: ${{ contains(github.event.client_payload.build_type, 'editors') && github.event.client_payload.production != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            cache-name: android-editor
            mono: false

    steps:
      - name: Checkout CI actions
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          fetch-depth: 1

      - name: Reuse completed asset
        if: ${{ !matrix.skip && github.event.client_payload.force != true }}
        id: reuse
        uses: ./.github/actions/cerebro-reuse-assets
        with:
          names: |
            ${{ matrix.cache-name }}-${{ inputs.external_status }}
            ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
            ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Checkout Repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ inputs.build_sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Decode the keystore
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          echo "$GODOT_ANDROID_SIGN_KEYSTORE_BAS64" | base64 --decode > godot.keystore
          export KEYSTORE_PATH=$PWD/godot.keystore
          echo "GODOT_ANDROID_SIGN_KEYSTORE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Remove existing workflows folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf .github/workflows

      - name: Pull .github folder from ci_cd repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          rm -rf ci_cd_repo

      - name: Update new Version Information to version.py
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/set-repos-version
        with:
          file_path: ${{ github.workspace }}/version.py
          external_major: ${{ inputs.new_major }}
          external_minor: ${{ inputs.new_minor }}
          external_patch: ${{ inputs.new_patch }}
          external_status: ${{ inputs.external_status }}
          external_sha: ${{ inputs.build_sha }}

      - name: Set up Java 17
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download pre-built Android Swappy Frame Pacing Library
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: darksylinc/godot-swappy
          version: tags/v2023.3.0.0
          file: godot-swappy.7z
          target: swappy/godot-swappy.7z

      - name: Extract pre-built Android Swappy Frame Pacing Library
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: 7za x -y swappy/godot-swappy.7z -o${{github.workspace}}/thirdparty/swappy-frame-pacing

      - name: Setup Android SDK
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: amyu/setup-android@v4

      - name: Restore Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-deps

      - name: Download and extract mono-glue
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          TYPE=${{ inputs.external_status }}
          REF=${{ inputs.engine_reference }}
          URL="https://cdn.blazium.app/monoglue/${REF}/${TYPE}/monoglue-${TYPE}.tar.gz"
          
          # Download the file
          curl -L $URL -o monoglue.tar.gz

          # Extract the entire archive to a temporary directory
          mkdir -p temp_extract
          tar -xzvf monoglue.tar.gz -C temp_extract

          # Create target directories if they don't exist
          mkdir -p modules/mono/glue/GodotSharp/GodotSharp
          mkdir -p modules/mono/glue/GodotSharp/GodotSharpEditor

          # Move the extracted folders to their target locations
          rsync -av temp_extract/GodotSharp/ modules/mono/glue/GodotSharp/GodotSharp/
          rsync -av temp_extract/GodotSharpEditor/ modules/mono/glue/GodotSharp/GodotSharpEditor/

          ls -la ./modules/mono/glue/GodotSharp/GodotSharp/
          ls -la ./modules/mono/glue/GodotSharp/GodotSharpEditor/

          # Clean up the temporary directory
          rm -rf temp_extract monoglue.tar.gz

      - name: Compilation (target=editor,arch=arm32,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm32 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=arm64,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=x86_64,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_64 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=x86_32,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_32 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Save Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Editor
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Generate Blazium editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}

      - name: Notify Cerebro of Build Success
        id: cerebro-completed
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Clear folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf bin/android_editor_builds/*

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Template
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Generate Godot Meta editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotHorizonOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}

      - name: Notify Cerebro of Build Success
        id: cerebro-completed-meta
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed-meta.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Clear folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf bin/android_editor_builds/*

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Template
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Generate Godot PicoOS editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotPicoOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}

      - name: Notify Cerebro of Build Success
        id: cerebro-completed-pico
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed-pico.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

  build-editors-prod:
    runs-on:  
      group: "release-builder"
    name: Building Production Android ${{ matrix.name }}
    needs: editor-check
    if: ${{ contains(github.event.client_payload.build_type, 'editors') && github.event.client_payload.production == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor
            cache-name: android-editor
            mono: false

    steps:
      - name: Checkout CI actions
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/ci_cd
          fetch-depth: 1

      - name: Reuse completed asset
        if: ${{ !matrix.skip && github.event.client_payload.force != true }}
        id: reuse
        uses: ./.github/actions/cerebro-reuse-assets
        with:
          names: |
            ${{ matrix.cache-name }}-${{ inputs.external_status }}
            ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
            ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          version: ${{ inputs.new_version }}
          build_sha: ${{ inputs.build_sha }}
          deploy_type: ${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Checkout Repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: blazium-games/blazium
          ref: ${{ inputs.build_sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Decode the keystore
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          echo "$GODOT_ANDROID_SIGN_KEYSTORE_BAS64" | base64 --decode > godot.keystore
          export KEYSTORE_PATH=$PWD/godot.keystore
          echo "GODOT_ANDROID_SIGN_KEYSTORE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Remove existing workflows folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf .github/workflows

      - name: Pull .github folder from ci_cd repository
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          git clone --depth=1 https://github.com/blazium-games/ci_cd.git ci_cd_repo
          cp -r ci_cd_repo/.github/* .github/
          rm -rf ci_cd_repo


      - name: Update new Version Information to version.py
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/set-repos-version
        with:
          file_path: ${{ github.workspace }}/version.py
          external_major: ${{ inputs.new_major }}
          external_minor: ${{ inputs.new_minor }}
          external_patch: ${{ inputs.new_patch }}
          external_status: ${{ inputs.external_status }}
          external_sha: ${{ inputs.build_sha }}

      - name: Set up Java 17
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download pre-built Android Swappy Frame Pacing Library
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: darksylinc/godot-swappy
          version: tags/v2023.3.0.0
          file: godot-swappy.7z
          target: swappy/godot-swappy.7z

      - name: Extract pre-built Android Swappy Frame Pacing Library
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: 7za x -y swappy/godot-swappy.7z -o${{github.workspace}}/thirdparty/swappy-frame-pacing

      - name: Setup Android SDK
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: amyu/setup-android@v4

      - name: Restore Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-deps

      - name: Download and extract mono-glue
        if: ${{ steps.reuse.outputs.should_compile != 'false' && (matrix.mono) }}
        run: |
          TYPE=${{ inputs.external_status }}
          REF=${{ inputs.engine_reference }}
          URL="https://cdn.blazium.app/monoglue/${REF}/${TYPE}/monoglue-${TYPE}.tar.gz"
          
          # Download the file
          curl -L $URL -o monoglue.tar.gz

          # Extract the entire archive to a temporary directory
          mkdir -p temp_extract
          tar -xzvf monoglue.tar.gz -C temp_extract

          # Create target directories if they don't exist
          mkdir -p modules/mono/glue/GodotSharp/GodotSharp
          mkdir -p modules/mono/glue/GodotSharp/GodotSharpEditor

          # Move the extracted folders to their target locations
          rsync -av temp_extract/GodotSharp/ modules/mono/glue/GodotSharp/GodotSharp/
          rsync -av temp_extract/GodotSharpEditor/ modules/mono/glue/GodotSharp/GodotSharpEditor/

          ls -la ./modules/mono/glue/GodotSharp/GodotSharp/
          ls -la ./modules/mono/glue/GodotSharp/GodotSharpEditor/

          # Clean up the temporary directory
          rm -rf temp_extract monoglue.tar.gz

      - name: Compilation (target=editor,arch=arm32,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm32 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=arm64,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=x86_64,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_64 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Compilation (target=editor,arch=x86_32,${{ matrix.mono && 'mono=yes' || 'mono=no' }})
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_32 ${{ matrix.mono && 'module_mono_enabled=yes' || '' }}
          platform: android
          target: editor

      - name: Save Godot build cache
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Editor
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}



      - name: Generate Godot Meta editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}


      - name: Notify Cerebro of Build Success
        id: cerebro-completed
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Clear folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf bin/android_editor_builds/*

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Template
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Generate Godot Meta editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotHorizonOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}


      - name: Notify Cerebro of Build Success
        id: cerebro-completed-meta
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-meta.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed-meta.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-meta
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Clear folder
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          rm -rf bin/android_editor_builds/*

      - name: Notify Cerebro of Build Starting
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-started
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          build_type: Template
          mono: ${{ matrix.mono }}
          deploy_type: ${{ inputs.external_status }}
          branch: ${{ github.event.client_payload.branch }}
          build_os: android
          arch: ${{ contains(matrix.cache-name, '32bit') && 'arm32' || 'arm64' }}
          checksum: ${{ inputs.build_sha }}
          production: ${{ github.event.client_payload.production }}
          version: ${{ inputs.new_version }}

      - name: Generate Godot PicoOS editor
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          cd platform/android/java
          ./gradlew generateGodotPicoOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Create tar.gz Archive
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        run: |
          tar -czvf ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz -C ./bin/android_editor_builds/ .

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ steps.reuse.outputs.should_compile != 'false' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          out_dir: ${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}

      - name: Notify Cerebro of Build Success
        id: cerebro-completed-pico
        if: ${{ success() && steps.reuse.outputs.should_compile != 'false' }}
        uses: ./.github/actions/cerebro-completed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
          run_id: ${{ inputs.runner_id }}
          file_url: ${{ secrets.CDN_URL }}/${{ env.DEPLOY_TYPE }}/${{ inputs.engine_reference }}/${{ inputs.external_status }}${{ startsWith(matrix.target, 'template_') && '/template' || '' }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          artifact_path: ${{ github.workspace }}/${{ matrix.cache-name }}-${{ inputs.external_status }}-pico.tar.gz
          version: ${{ inputs.new_version }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}

      - name: Notify Cerebro of Build Failure
        if: ${{ steps.reuse.outputs.should_compile != 'false' && ((failure() || cancelled()) && steps.cerebro-completed-pico.outcome != 'failure') }}
        uses: ./.github/actions/cerebro-failed
        with:
          name: ${{ matrix.cache-name }}-${{ inputs.external_status }}-pico
